# The plugin needs plugin API 0.9 of the picom fork, which only the fork has so far. The
# build jobs fetch its API headers at PICOM_REF from github.com/JornC/picom: its branch
# winanim, until it is tagged.
#
# The harness, tests/run.sh, doesn't run here, only locally: on GitHub's runners picom
# draws a frame only every 60 ms or so, too few for its checks of motion to judge.
#
# clang-format output differs between major versions, so the formatting check pins
# clang-format 23.1.3, the version the code is formatted with. shellcheck is pinned to
# 0.11.0 for the same reason.

name: CI

on:
  push:
  pull_request:

env:
  PICOM_REPOSITORY: JornC/picom
  PICOM_REF: winanim

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The code is C23 (-std=gnu23): GCC 14 or clang 18 and later.
          - cc: gcc-14
            style: true
          - cc: clang
            style: false
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O2 -g -Werror
      PICOM_API_CFLAGS: -I${{ github.workspace }}/picom/include
    steps:
      - uses: actions/checkout@v4

      - name: Fetch picom's API headers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PICOM_REPOSITORY }}
          ref: ${{ env.PICOM_REF }}
          path: picom
          sparse-checkout: include/picom

      - name: Install the compiler and the libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} make pkg-config libxcb1-dev \
            libxcb-damage0-dev libxcb-randr0-dev libxcb-xfixes0-dev

      - name: Build
        run: make

      - name: Unit tests
        run: make check

      - name: Unit tests with sanitizers
        run: |
          # ASan fails with the high mmap randomization of newer runner kernels.
          sudo sysctl -w vm.mmap_rnd_bits=28
          make clean
          make check SANITIZE=address,undefined

      - uses: actions/setup-python@v5
        if: matrix.style
        with:
          python-version: "3.x"

      - name: Install clang-format and shellcheck
        if: matrix.style
        run: |
          pip install clang-format==23.1.3
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz |
            tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >>"$GITHUB_PATH"

      - name: Check the formatting
        if: matrix.style
        run: |
          clang-format --version
          make format-check

      - name: Lint
        if: matrix.style
        run: |
          shellcheck --version
          make lint
