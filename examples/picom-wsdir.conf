# Workspace slides with the ws-direction plugin, for two monitors: a landscape one on the
# left that slides vertically, and one to its right (x >= 3440) that slides horizontally.
# Change 3440 to where your second monitor starts. Load the plugin with a plugins line,
# for example:
#   plugins = "/path/to/build/ws-direction.so";
#
# workspace-direction is 1 when the new workspace sorts after the old one ("1:IDE" -> "4:Misc"),
# -1 when it sorts before, and 0 when the show/hide/open is not caused by a workspace switch
# on that monitor (new windows, scratchpad, fullscreen, moving a window to another workspace).
# With 0 the window gets a short fade instead of a slide.
#
# The script language has no conditionals, so the two cases are mixed with
#   var-slide = workspace-direction ^ 2   (1 for a slide, 0 for a fade)
# Every slide is cropped to the monitor of its workspace (workspace-monitor-*), so nothing
# bleeds onto the other one, also not floating windows that hang off the edge of their
# monitor. window-monitor-* would be the whole screen for those.
#
# Floating windows are animated too: with a direction they slide along with their
# workspace, and scratchpad windows and dialogs get the fade.

backend = "glx";
vsync = true;
use-damage = true;

# Unredirecting fullscreen windows turns compositing (and animations) off. Keep it off while testing.
unredir-if-possible = false;

rules = (
  {
    match = "x < 3440 && !override_redirect && window_type = 'normal'";
    animations = (
      {
        triggers = ["hide"];
        var-slide = "workspace-direction ^ 2";
        var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
        offset-y = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = 0; end = "0 - workspace-direction * workspace-monitor-height"; };
        opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
        crop-x = "workspace-monitor-x";
        crop-y = "workspace-monitor-y";
        crop-width = "workspace-monitor-width";
        crop-height = "workspace-monitor-height";
      },
      {
        triggers = ["show", "open"];
        var-slide = "workspace-direction ^ 2";
        var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
        offset-y = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "workspace-direction * workspace-monitor-height"; end = 0; };
        opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
        crop-x = "workspace-monitor-x";
        crop-y = "workspace-monitor-y";
        crop-width = "workspace-monitor-width";
        crop-height = "workspace-monitor-height";
      }
    );
  },
  {
    match = "x >= 3440 && !override_redirect && window_type = 'normal'";
    animations = (
      {
        triggers = ["hide"];
        var-slide = "workspace-direction ^ 2";
        var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
        offset-x = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = 0; end = "0 - workspace-direction * workspace-monitor-width"; };
        opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
        crop-x = "workspace-monitor-x";
        crop-y = "workspace-monitor-y";
        crop-width = "workspace-monitor-width";
        crop-height = "workspace-monitor-height";
      },
      {
        triggers = ["show", "open"];
        var-slide = "workspace-direction ^ 2";
        var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
        offset-x = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "workspace-direction * workspace-monitor-width"; end = 0; };
        opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
        crop-x = "workspace-monitor-x";
        crop-y = "workspace-monitor-y";
        crop-width = "workspace-monitor-width";
        crop-height = "workspace-monitor-height";
      }
    );
  }
);
