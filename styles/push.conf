# Push: going to a higher workspace, the new one slides in over the old one, which drifts a
# third of the way in the same direction and darkens away, like a card put on a stack.
# Going back, the top card slides away and the one below drifts back into place.
# var-ahead is 1 going forward and 0 going back. The card below is cropped to the part
# the top card doesn't cover, so it doesn't matter which one picom draws on top.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/push.conf"
#   });
#
# var-slide is 1 for a workspace switch and 0 otherwise; then the window gets a short
# fade. var-sideways is 1 on a portrait monitor and 0 on a landscape one: the workspaces
# move along the short side of the monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-size = "var-sideways * workspace-monitor-width + (1 - var-sideways) * workspace-monitor-height";
  var-time = "0.3 * var-slide + 0.1 * (1 - var-slide)";
  var-ahead = "(1 + workspace-direction) / 2";
  # How much of the way is still left: 1 at the start of a switch, 0 at the end.
  var-left = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-slide"; end = 0; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "1 - var-slide"; end = 0; };
  # Going forward the new card slides in over the old one; going back it is the card
  # below, which drifts back into place and lights up.
  var-move = "var-left * var-size * (var-ahead - 0.3 * (1 - var-ahead))";
  offset-x = "var-move * var-sideways";
  offset-y = "var-move * (1 - var-sideways)";
  opacity = "window-raw-opacity * (1 - 0.6 * (1 - var-ahead) * var-left) * (1 - var-fade)";
  # Going back, show only the part the top card has left.
  var-hidden = "(1 - var-ahead) * var-left";
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width * (1 - var-sideways * var-hidden)";
  crop-height = "workspace-monitor-height * (1 - (1 - var-sideways) * var-hidden)";
}, {
  triggers = ["hide"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-size = "var-sideways * workspace-monitor-width + (1 - var-sideways) * workspace-monitor-height";
  var-time = "0.3 * var-slide + 0.1 * (1 - var-slide)";
  var-ahead = "(1 + workspace-direction) / 2";
  # How much of the way is done: 0 at the start of a switch, 1 at the end.
  var-done = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = 0; end = "var-slide"; };
  var-fade = { curve = "linear"; duration = "var-time"; start = 0; end = "1 - var-slide"; };
  # Going forward the old card drifts and darkens away under the new one; going back it
  # is the top card, which slides away.
  var-move = "var-done * var-size * (1 - var-ahead - 0.3 * var-ahead)";
  offset-x = "var-move * var-sideways";
  offset-y = "var-move * (1 - var-sideways)";
  # window-raw-opacity-before only holds for the first frame, so keep it from there.
  var-opacity = { duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; };
  opacity = "var-opacity * (1 - var-ahead * var-done) * (1 - var-fade)";
  # Going forward, show only the part the new card doesn't cover yet.
  var-hidden = "var-ahead * var-done";
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width * (1 - var-sideways * var-hidden)";
  crop-height = "workspace-monitor-height * (1 - (1 - var-sideways) * var-hidden)";
});
