# Push: going to a higher workspace, the new one slides in over the old one, which
# drifts a third of the way in the same direction, like a card put on a stack. Going
# back, the top card slides away and the one below drifts back into place. No window
# gets see-through during a switch, so it looks the same on any background.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/push.conf"
#   });
#
# Like the pass styles, it moves the windows of every workspace of the monitor in a
# switch, through ws-pass, which the plugin starts on all of them in one frame: that
# keeps the old and the new workspace in step even when the window manager hides one a
# frame after it shows the other, and a switch made while one runs goes on from where
# every window is. The workspaces a switch passes come by on the way. ws-pass draws
# hidden windows from the images picom keeps of them (keep-image-when-hidden), which
# takes memory, and a workspace picom has not shown since it started has no images yet;
# see pass-slide.conf and the README. The show and hide parts make the same move for a
# window that picom has no image of yet, and give a window outside a switch a fade.
#
# The workspaces are cards on a stack, in their order, each higher one on top. var-pos
# is a window's place on the strip, in monitors from the view, going from var-face to
# var-face - var-travel. A card at var-pos above 0 lies on top of the one in view and
# moves by var-pos; one below 0 lies under it and moves by var-drift * var-pos, and is
# cropped to the part the card on top of it, at var-pos + 1, doesn't cover (var-cut of
# it shows). var-pos means the same in all four cases (the card coming in or going out,
# on top or under), so the cards cover the monitor without a gap, whichever picom draws
# on top, also when a switch comes while one runs.
#
# Settings, in each of the three parts: var-length is how long a switch takes, in
# seconds; var-pass-growth is how much of var-length each workspace passed adds (0: a
# switch takes var-length however far it goes). var-drift is how far the card below
# drifts, as a share of the card on top. Which way the workspaces lie (var-axis,
# var-reverse), the fade of windows outside a switch (var-other-time) and whether they
# lie on a ring (var-wrap) are in parts/axis.conf and parts/switch.conf, shared by all
# switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.3;
  var-pass-growth = 0;
  var-drift = 0.3;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-move = "var-reverse * (max(0, var-pos) + var-drift * min(0, var-pos))";
  offset-x = "var-move * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-move * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  var-cut = "max(0, 1 + min(0, var-pos))";
  var-cut-at = "(1 - var-reverse) / 2 * (1 - var-cut)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x + var-sideways * var-cut-at * plugin-ws-direction-monitor-width";
  crop-y = "plugin-ws-direction-monitor-y + (1 - var-sideways) * var-cut-at * plugin-ws-direction-monitor-height";
  crop-width = "plugin-ws-direction-monitor-width * (1 - var-sideways * (1 - var-cut))";
  crop-height = "plugin-ws-direction-monitor-height * (1 - (1 - var-sideways) * (1 - var-cut))";
}, {
  triggers = ["hide"];
  var-length = 0.3;
  var-pass-growth = 0;
  var-drift = 0.3;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-move = "var-reverse * (max(0, var-pos) + var-drift * min(0, var-pos))";
  offset-x = "var-move * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-move * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  var-cut = "max(0, 1 + min(0, var-pos))";
  var-cut-at = "(1 - var-reverse) / 2 * (1 - var-cut)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x + var-sideways * var-cut-at * plugin-ws-direction-monitor-width";
  crop-y = "plugin-ws-direction-monitor-y + (1 - var-sideways) * var-cut-at * plugin-ws-direction-monitor-height";
  crop-width = "plugin-ws-direction-monitor-width * (1 - var-sideways * (1 - var-cut))";
  crop-height = "plugin-ws-direction-monitor-height * (1 - (1 - var-sideways) * (1 - var-cut))";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.3;
  var-pass-growth = 0;
  var-drift = 0.3;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-move = "var-reverse * (max(0, var-pos) + var-drift * min(0, var-pos))";
  offset-x = "var-move * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-move * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  var-cut = "max(0, 1 + min(0, var-pos))";
  var-cut-at = "(1 - var-reverse) / 2 * (1 - var-cut)";
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide";
  crop-x = "plugin-ws-direction-monitor-x + var-sideways * var-cut-at * plugin-ws-direction-monitor-width";
  crop-y = "plugin-ws-direction-monitor-y + (1 - var-sideways) * var-cut-at * plugin-ws-direction-monitor-height";
  crop-width = "plugin-ws-direction-monitor-width * (1 - var-sideways * (1 - var-cut))";
  crop-height = "plugin-ws-direction-monitor-height * (1 - (1 - var-sideways) * (1 - var-cut))";
});
