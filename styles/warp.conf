# Warp: the old workspace sinks into a point and is gone halfway through the switch;
# then the new one bursts out of another. Going to a higher workspace it sinks into a
# point above the middle of the monitor and the new one comes out of one below it (or
# left and right on a portrait monitor, like slide); going back the points swap. The two
# halves don't overlap, so it doesn't matter which one picom draws on top, and no window
# gets see-through during a switch.
#
# The whole workspace scales by s around the point (px, py), var-shift of the monitor
# from its middle. picom scales a window around its top-left corner, so a window at x
# moves by (1 - s) * (px - x). A new window waits out the first half at s = 0.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/warp.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-slide is 1 for a workspace switch and 0
# otherwise; then the window gets a short fade. var-sideways is 1 on a portrait monitor
# and 0 on a landscape one: the points sit along the short side of the monitor. var-shift
# is how far they are from the middle, as a share of the monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.35;
  var-shift = 0.25;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "var-time / 2 * var-slide";
  var-s = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "1 - var-slide"; end = 1; };
  var-px = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (0.5 + var-shift * plugin-ws-direction-direction * var-sideways)";
  var-py = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (0.5 + var-shift * plugin-ws-direction-direction * (1 - var-sideways))";
  scale-x = "var-s";
  scale-y = "var-s";
  offset-x = "(1 - var-s) * (var-px - window-x)";
  offset-y = "(1 - var-s) * (var-py - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.35;
  var-shift = 0.25;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-s = { curve = "cubic-bezier(0.5, 0, 0.8, 0.3)"; duration = "var-time * (1 - var-slide / 2)"; start = 1; end = "1 - var-slide"; };
  var-px = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (0.5 - var-shift * plugin-ws-direction-direction * var-sideways)";
  var-py = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (0.5 - var-shift * plugin-ws-direction-direction * (1 - var-sideways))";
  scale-x = "var-s";
  scale-y = "var-s";
  offset-x = "(1 - var-s) * (var-px - window-x)";
  offset-y = "(1 - var-s) * (var-py - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
