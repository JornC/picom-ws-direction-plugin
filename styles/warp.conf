# Warp: the old workspace sinks into the middle of the monitor and is gone halfway
# through the switch; then the new one appears. Going to a higher workspace it bursts out
# of the middle; going back it comes in from outside the monitor and shrinks into place.
# The two halves don't overlap, so it doesn't matter which one picom draws on top, and
# no window gets see-through during a switch.
#
# The whole workspace scales by s around the middle of the monitor (mx, my). picom
# scales a window around its top-left corner, so a window at x moves by
# (1 - s) * (mx - x). A new window waits for the first half with var-on at 0, which
# makes it 0 wide; var-big is how large it starts going back.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/warp.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-slide is 1 for a workspace switch and 0
# otherwise; then the window gets a short fade. Warp looks the same on every monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-ahead = "(1 + plugin-ws-direction-direction) / 2";
  var-length = 0.35;
  var-big = 3;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "var-time / 2 * var-slide";
  var-on = { curve = "linear"; delay = "var-wait"; duration = 0.001; start = "1 - var-slide"; end = 1; };
  var-s = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "1 - var-slide + var-slide * (1 - var-ahead) * var-big"; end = 1; };
  var-mx = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
  var-my = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
  scale-x = "var-on * var-s";
  scale-y = "var-on * var-s";
  offset-x = "(1 - var-on * var-s) * (var-mx - window-x)";
  offset-y = "(1 - var-on * var-s) * (var-my - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-length = 0.35;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-s = { curve = "cubic-bezier(0.5, 0, 0.8, 0.3)"; duration = "var-time * (1 - var-slide / 2)"; start = 1; end = "1 - var-slide"; };
  var-mx = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
  var-my = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
  scale-x = "var-s";
  scale-y = "var-s";
  offset-x = "(1 - var-s) * (var-mx - window-x)";
  offset-y = "(1 - var-s) * (var-my - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
