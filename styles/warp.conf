# Warp: going to a higher workspace, the old windows fly outward past you and grow while
# they fade, and the new ones come out of the middle of the monitor; going back, the old
# windows fall into the middle and the new ones fly in from outside. Each window moves its
# middle away from the middle of the monitor by var-spread times their distance, and
# scales around its own middle.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/warp.conf"
#   });
#
# var-slide is 1 for a workspace switch and 0 otherwise; then the window gets a short
# fade. Warp looks the same on every monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "workspace-direction ^ 2";
  var-time = "0.3 * var-slide + 0.1 * (1 - var-slide)";
  var-p = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; duration = "var-time"; start = "1 - var-slide"; end = 1; };
  var-spread = "0 - 0.6 * workspace-direction * (1 - var-p)";
  var-scale = "1 - 0.3 * workspace-direction * (1 - var-p)";
  opacity = { curve = "linear"; duration = "var-time"; start = 0; end = "window-raw-opacity"; };
  scale-x = "var-scale";
  scale-y = "var-scale";
  offset-x = "var-spread * (window-x + window-width / 2 - workspace-monitor-x - workspace-monitor-width / 2) + (1 - var-scale) * window-width / 2";
  offset-y = "var-spread * (window-y + window-height / 2 - workspace-monitor-y - workspace-monitor-height / 2) + (1 - var-scale) * window-height / 2";
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "workspace-direction ^ 2";
  var-time = "0.3 * var-slide + 0.1 * (1 - var-slide)";
  var-p = { curve = "cubic-bezier(0.5, 0, 0.8, 0.3)"; duration = "var-time"; start = 0; end = "var-slide"; };
  var-spread = "0.6 * workspace-direction * var-p";
  var-scale = "1 + 0.3 * workspace-direction * var-p";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = 0; };
  scale-x = "var-scale";
  scale-y = "var-scale";
  offset-x = "var-spread * (window-x + window-width / 2 - workspace-monitor-x - workspace-monitor-width / 2) + (1 - var-scale) * window-width / 2";
  offset-y = "var-spread * (window-y + window-height / 2 - workspace-monitor-y - workspace-monitor-height / 2) + (1 - var-scale) * window-height / 2";
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
});
