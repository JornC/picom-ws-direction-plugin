# Warp: the old workspace sinks into a point and is gone halfway through the switch;
# then the new one bursts out of another. Going to a higher workspace it sinks into a
# point above the middle of the monitor and the new one comes out of one below it (or
# left and right, as the workspaces lie); going back the points swap. The two halves
# don't overlap, so it doesn't matter which one picom draws on top, and no window gets
# see-through during a switch.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/warp.conf"
#   });
#
# Like the pass styles, it moves the windows of every workspace of the monitor in a
# switch, through ws-pass, which the plugin starts on all of them in one frame: that
# keeps the old and the new workspace in step even when the window manager hides one a
# frame after it shows the other, and a switch made while one runs goes on from where
# every window is. The workspaces a switch passes come by on the way. ws-pass draws
# hidden windows from the images picom keeps of them (keep-image-when-hidden), which
# takes memory, and a workspace picom has not shown since it started has no images yet;
# see pass-slide.conf and the README. The show and hide parts make the same move for a
# window that picom has no image of yet, and give a window outside a switch a fade.
#
# The whole workspace scales by var-s around the point (var-px, var-py), var-shift of
# the monitor from its middle, on the side of the window's workspace (var-side: toward
# where the old one goes, and where the new one comes from). picom scales a window
# around its top-left corner, so a window at x moves by (1 - s) * (px - x). In ws-pass
# the old workspace (var-old) sinks in the first half, the new one (var-new) waits it
# out at s = 0 and grows in the second, and the workspaces passed are not drawn. Both
# use one curve, var-s, so that a window that turns back in a switch made while one runs
# goes on from its size, and var-side moves its point over rather than jump. A window
# that was sinking or growing doesn't wait out the first half again (var-s-moving, from
# var-s-before-speed). Warp moves windows by their size, not along the strip, so
# var-interrupt doesn't change how it looks; it does set var-from, var-to and var-ease,
# the place on the strip that parts/switch.conf carries.
#
# Settings, in each of the three parts: var-length is how long a switch takes, in
# seconds; var-pass-growth is how much of var-length each workspace passed adds (0: a
# switch takes var-length however far it goes). var-shift is how far the points are from
# the middle, as a share of the monitor. Which way the workspaces lie (var-axis,
# var-reverse), the fade of windows outside a switch (var-other-time) and whether they
# lie on a ring (var-wrap) are in parts/axis.conf and parts/switch.conf, shared by all
# switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.35;
  var-pass-growth = 0;
  var-shift = 0.25;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-old = 0;
  var-new = 1;
  var-way = "var-travel / max(1, abs(var-travel))";
  var-s-moving = "interrupted * min(1, ceil(abs(var-s-before-speed)))";
  var-s = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; delay = "var-time / 2 * var-slide * (1 - var-s-moving)"; duration = "var-time / (1 + var-slide)"; start = "1 - var-slide"; end = 1; };
  var-side = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time / 2"; start = "var-way * (var-new - var-old) * var-slide"; end = "var-way * (var-new - var-old) * var-slide"; };
  var-px = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (0.5 + var-shift * var-reverse * var-side * var-sideways)";
  var-py = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (0.5 + var-shift * var-reverse * var-side * (1 - var-sideways))";
  scale-x = "var-s";
  scale-y = "var-s";
  offset-x = "(1 - var-s) * (var-px - window-x)";
  offset-y = "(1 - var-s) * (var-py - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-length = 0.35;
  var-pass-growth = 0;
  var-shift = 0.25;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-old = 1;
  var-new = 0;
  var-way = "var-travel / max(1, abs(var-travel))";
  var-s = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; duration = "var-time / (1 + var-slide)"; start = 1; end = "1 - var-slide"; };
  var-side = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time / 2"; start = "var-way * (var-new - var-old) * var-slide"; end = "var-way * (var-new - var-old) * var-slide"; };
  var-px = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (0.5 + var-shift * var-reverse * var-side * var-sideways)";
  var-py = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (0.5 + var-shift * var-reverse * var-side * (1 - var-sideways))";
  scale-x = "var-s";
  scale-y = "var-s";
  offset-x = "(1 - var-s) * (var-px - window-x)";
  offset-y = "(1 - var-s) * (var-py - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.35;
  var-pass-growth = 0;
  var-shift = 0.25;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-way = "var-travel / max(1, abs(var-travel))";
  var-old = "max(0, 1 - abs(var-face))";
  var-new = "max(0, 1 - abs(var-face - var-travel))";
  var-s-moving = "interrupted * min(1, ceil(abs(var-s-before-speed)))";
  var-s = { curve = "cubic-bezier(0.2, 0.7, 0.3, 1)"; delay = "var-time / 2 * var-new * var-slide * (1 - var-s-moving)"; duration = "var-time / 2"; start = "1 - var-new"; end = "var-new"; };
  var-side = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time / 2"; start = "var-way * (var-new - var-old) * var-slide"; end = "var-way * (var-new - var-old) * var-slide"; };
  var-px = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (0.5 + var-shift * var-reverse * var-side * var-sideways)";
  var-py = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (0.5 + var-shift * var-reverse * var-side * (1 - var-sideways))";
  scale-x = "var-s";
  scale-y = "var-s";
  offset-x = "(1 - var-s) * (var-px - window-x)";
  offset-y = "(1 - var-s) * (var-py - window-y)";
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * var-slide * min(1, var-old + var-new)";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
