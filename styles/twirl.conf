# Twirl: on a workspace switch the windows of the old workspace spin out, a quarter turn
# in the plane of the screen as they shrink around their middles and fade, and those of
# the new one spin in, on the same way round. Going back spins the other way. It goes
# with win-cause's twirl. Needs a picom with the corner outputs and window-image-width.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded, as slide.conf. It
# is pop.conf with a turn (parts/twirl.conf): the windows stay in their places, and how
# far a window is from the view on the strip (var-pos) sets its size, turn and opacity.
#
# Settings, in each of the three parts: var-length and var-pass-growth as in slide.conf;
# var-small, the size a window shrinks to; var-turn, how far it turns, in turns; var-gone,
# how far from the view, in workspaces, a window has gone.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.35;
  var-pass-growth = 0.2;
  var-small = 0.2;
  var-turn = 0.25;
  var-gone = 0.6;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  opacity = "var-fade * var-shown";
  @include "ws-direction/parts/twirl.conf"
}, {
  triggers = ["hide"];
  var-length = 0.35;
  var-pass-growth = 0.2;
  var-small = 0.2;
  var-turn = 0.25;
  var-gone = 0.6;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  opacity = "var-fade * var-shown";
  @include "ws-direction/parts/twirl.conf"
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.35;
  var-pass-growth = 0.2;
  var-small = 0.2;
  var-turn = 0.25;
  var-gone = 0.6;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide * var-shown";
  @include "ws-direction/parts/twirl.conf"
});
