# Zoom: going to a higher workspace, the old one grows a little and fades out while the new
# one rises from slightly smaller; going back reverses it. Scaling is from a window's
# top-left corner, so each window also moves, to scale around the middle of the monitor:
#   offset = (1 - scale) * (middle of the monitor - window position)
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/zoom.conf"
#   });
#
# var-slide is 1 for a workspace switch and 0 otherwise; then the window gets a short
# fade. var-sideways is 1 on a portrait monitor and 0 on a landscape one: the workspaces
# move along the short side of the monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
  var-scale = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "1 - 0.08 * workspace-direction"; end = 1; };
  scale-x = "var-scale";
  scale-y = "var-scale";
  offset-x = "(1 - var-scale) * (workspace-monitor-x + workspace-monitor-width / 2 - window-x)";
  offset-y = "(1 - var-scale) * (workspace-monitor-y + workspace-monitor-height / 2 - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = 0; end = "window-raw-opacity"; };
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
  var-scale = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = 1; end = "1 + 0.08 * workspace-direction"; };
  scale-x = "var-scale";
  scale-y = "var-scale";
  offset-x = "(1 - var-scale) * (workspace-monitor-x + workspace-monitor-width / 2 - window-x)";
  offset-y = "(1 - var-scale) * (workspace-monitor-y + workspace-monitor-height / 2 - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = 0; };
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
});
