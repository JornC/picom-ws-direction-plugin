# Not a style: every part of the switch styles includes this. It sets what all switch
# styles share; to change it for all of them, copy this file to ws-direction/parts/ next
# to picom.conf.
#   var-slide           1 for a workspace switch, 0 otherwise
#   var-other-time      how long the fade of a window that is not in a switch takes, in
#                       seconds
#   var-wrap            0: the workspaces of a monitor lie on a strip, and a switch moves
#                       along it to the new one; 1: they lie on a ring, the last next to
#                       the first, and a switch goes the short way round, also for a window
#                       that turns back from where a switch made while one runs left it
#   var-interrupt       what a window does when a switch interrupts the one it moves in:
#                       0 starts the style's curve again from where the window is, so it
#                       slows to a stop and speeds up again; 1 keeps the speed it has, and
#                       slows to rest at its place on a cubic curve (var-keep); 2 lets a
#                       spring take it there from that speed (var-spring). A switch that
#                       interrupts nothing uses the style's curve.
#   var-follow          0: a switch takes var-time for the workspaces it moves, also when
#                       it interrupts one; 1: a switch that interrupts one takes the time
#                       of the distance its windows still have to go (var-left), by the
#                       same rule
#   var-spring-damping  the damping of the spring in var-spring's curve, below: change
#                       both together, and keep the damping at most 2 sqrt(stiffness)
# and works out what a switch is made of:
#   var-travel          how many workspaces the switch moves the view, and which way: the
#                       plugin's direction * distance, or the short way round
#   var-face            the window's workspace's place, in workspaces from the one shown
#                       before the switch: the plugin's face, or the nearer way round
#   var-start, var-end  where the window starts and ends on the strip: var-from and var-to
#                       of the part, or, when the switch interrupts an animation that put
#                       the window on the strip (var-on-strip, parts/axis.conf), where it
#                       was then (var-pos-before), to the nearer var-to on a ring
#   var-time            how long the animation takes: var-length for a switch to the next
#                       workspace, and var-pass-growth of var-length more for each
#                       workspace the switch passes, in proportion for less than one; for
#                       a spring, until it is within a quarter of a pixel of its place;
#                       var-other-time when it is not part of a switch
#   var-pos             the window's place on the strip, in workspaces from the view:
#                       var-ease of the part, or var-keep or var-spring
#   var-q               how far the switch is, from 0 to 1, evenly in time
#   var-dip             sin(180 var-q)^2 in a switch, else 0: 0 at its start and end, 1
#                       halfway, and it leaves 0 and comes back to it without speed,
#                       slowing over the last quarter of the switch; for what a style does
#                       in the middle of a switch only, like a zoom. A switch that
#                       interrupts one starts it from where it was, and with var-interrupt
#                       1 or 2 at the speed it had, and still comes back to 0 at its end
# The part that includes it sets var-length and var-pass-growth; var-from and var-to,
# where the window is on the strip at the start and at the end of the switch; and
# var-ease, the style's curve:
#   var-ease = { curve = "..."; duration = "var-time"; start = "var-start";
#                end = "var-end"; reset = true; };
# parts/axis.conf, which this includes, says which way the workspaces lie.

@include "ws-direction/parts/axis.conf"
var-slide = "plugin-ws-direction-direction ^ 2";
var-other-time = 0.1;
var-wrap = 0;
var-interrupt = 0;
var-follow = 0;
var-spring-damping = 26;
var-ring = "max(1, plugin-ws-direction-faces)";
var-travel = "plugin-ws-direction-direction * plugin-ws-direction-distance - var-wrap * var-ring * round(plugin-ws-direction-direction * plugin-ws-direction-distance / var-ring)";
var-face = "plugin-ws-direction-face - var-wrap * var-ring * round(plugin-ws-direction-face / var-ring)";
var-carried = "var-on-strip-before";
var-moving = "var-carried * min(1, ceil(abs(var-pos-before-speed)))";
var-start = "var-carried * var-pos-before + (1 - var-carried) * var-from";
var-end = "var-to + var-wrap * var-carried * var-ring * round((var-start - var-to) / var-ring)";
var-left = "abs(var-end - var-start)";
var-steps = "max(0.001, var-follow * var-carried * var-left + (1 - var-follow * var-carried) * abs(var-travel))";
var-keeps = "var-carried * max(0, 1 - abs(var-interrupt - 1))";
var-springs = "var-carried * max(0, 1 - abs(var-interrupt - 2))";
var-start-speed = "var-carried * var-pos-before-speed";
var-spring-tol = "0.25 / max(plugin-ws-direction-monitor-width, plugin-ws-direction-monitor-height)";
var-spring-reach = "max(1, (2.85 * var-left + 4.91 * abs(var-start-speed) / var-spring-damping) / var-spring-tol)";
var-spring-time = "max(0.001, 150.6 / var-spring-damping * (var-spring-reach ^ (1 / 64) - 1))";
var-ease-time = "var-length * min(var-steps, 1 + var-pass-growth * (var-steps - 1))";
var-time = "(var-springs * var-spring-time + (1 - var-springs) * var-ease-time) * var-slide + var-other-time * (1 - var-slide)";
var-keep = { duration = "var-time"; start = "var-start"; end = "var-end"; start-speed = "var-start-speed"; reset = true; };
var-spring = { curve = "spring(169, 26)"; duration = "var-time"; start = "var-start"; end = "var-end"; start-speed = "var-start-speed"; reset = true; };
var-pos = "var-ease + var-keeps * (var-keep - var-ease) + var-springs * (var-spring - var-ease)";
var-q = { curve = "linear"; duration = "var-time"; start = 0; end = 1; reset = true; };
var-dip-keeps = "var-carried * min(1, var-interrupt)";
var-dip = "(1 - cos(pi * var-q) ^ 2 * (1 - var-dip-before * (2 * var-q ^ 3 - 3 * var-q ^ 2 + 1) - var-dip-keeps * var-dip-before-speed * var-time * (var-q ^ 3 - 2 * var-q ^ 2 + var-q))) * var-slide";
