# Not a style: every part of the switch styles includes this. It sets what all switch
# styles share; to change it for all of them, copy this file to ws-direction/parts/ next
# to picom.conf.
#   var-slide        1 for a workspace switch, 0 otherwise
#   var-other-time   how long the fade of a window that is not in a switch takes, in
#                    seconds
#   var-wrap         0: the workspaces of a monitor lie on a strip, and a switch moves
#                    along it to the new one; 1: they lie on a ring, the last next to the
#                    first, and a switch goes the short way round. With 1, a switch made
#                    while one runs can turn a workspace from the far side of the ring
#                    through the view, as a style can't tell where a window was
#   var-travel       how many workspaces the switch moves the view, and which way: the
#                    plugin's direction * distance, or the short way round
#   var-face         the window's workspace's place, in workspaces from the one shown
#                    before the switch: the plugin's face, or the nearer way round
#   var-time         how long the animation takes: var-length for a switch to the next
#                    workspace, and var-pass-growth of var-length more for each workspace
#                    the switch passes; var-other-time when it is not part of a switch
#   var-q            how far the switch is, from 0 to 1, evenly in time
#   var-dip          sin(180 var-q)^2 in a switch, else 0: 0 at its start and end, 1
#                    halfway, and it leaves 0 and comes back to it without speed, slowing
#                    over the last quarter of the switch; for what a style does in the
#                    middle of a switch only, like a zoom
# The part that includes it sets var-length and var-pass-growth. parts/axis.conf, which
# this includes, says which way the workspaces lie.

@include "ws-direction/parts/axis.conf"
var-slide = "plugin-ws-direction-direction ^ 2";
var-other-time = 0.1;
var-wrap = 0;
var-ring = "max(1, plugin-ws-direction-faces)";
var-travel = "plugin-ws-direction-direction * plugin-ws-direction-distance - var-wrap * var-ring * round(plugin-ws-direction-direction * plugin-ws-direction-distance / var-ring)";
var-face = "plugin-ws-direction-face - var-wrap * var-ring * round(plugin-ws-direction-face / var-ring)";
var-time = "var-length * (1 + var-pass-growth * (abs(var-travel) - 1)) * var-slide + var-other-time * (1 - var-slide)";
var-q = { curve = "linear"; duration = "var-time"; start = 0; end = 1; };
var-dip = "sin(pi * var-q) ^ 2 * var-slide";
