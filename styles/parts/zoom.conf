# Not a style: zoom-pan.conf, pass-zoom-pan.conf, pass-zoom-cascade.conf and wall.conf
# include this, so that the overview's strip is the one the switches pan along. To change
# it for all of them, copy this file to ws-direction/parts/ next to picom.conf.
#   var-zoom   how far a switch zooms out: 0.15 is to 85%
#   var-gap    the gap between the workspaces on the strip, as a share of the monitor
# The part that includes it sets var-k, the zoom, and var-pos, the window's place on the
# strip, in workspaces from the view. This scales the whole workspace by var-k around the
# middle of the monitor (mx, my), with the workspaces var-gap of a monitor apart. picom
# scales a window around its top-left corner, so a window at x lands at
# mx + k * (x + pan - mx): an offset of (1 - k) * (mx - x) + k * pan.

var-zoom = 0.15;
var-gap = 0.05;
var-mx = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
var-my = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
var-pan-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width * (1 + var-gap)";
var-pan-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height * (1 + var-gap)";
scale-x = "var-k";
scale-y = "var-k";
offset-x = "(1 - var-k) * (var-mx - window-x) + var-k * var-pan-x";
offset-y = "(1 - var-k) * (var-my - window-y) + var-k * var-pan-y";
