# Not a style: twirl.conf includes this in each of its parts. As parts/pop.conf, and the
# window also turns in the plane of the screen, var-turn of a turn by var-gone of a
# workspace away, through its corners. The turn follows the sign of var-pos, so the old
# and the new workspace spin the same way round, and going back spins the other way.
var-u = "max(-1, min(1, var-pos / var-gone))";
# As in parts/pop.conf, a window that the switch carries from one side of the view to
# the other peaks round (var-cap). Its turn grows with the square of the distance: slow
# near the view, so it doesn't turn far between two frames as it passes.
var-cap-own = "min(1, max(0, ceil(0 - var-start * var-end - 0.000001)))";
var-cap0 = "var-carried * var-cap-before + (1 - var-carried) * var-cap-own";
var-cap = "var-cap0 + (var-cap-own - var-cap0) * var-q * var-q * (3 - 2 * var-q)";
var-near = "(1 - abs(var-u)) * (1 + var-cap * abs(var-u))";
var-size = "var-small + (1 - var-small) * var-near";
var-shown = "var-near";
blur-opacity = "window-blur-opacity * var-shown";
var-phi = "-2 * pi * var-turn * var-u * (1 - var-cap + var-cap * abs(var-u))";
var-cx = "window-x + window-width / 2";
var-cy = "window-y + window-height / 2";
var-hw = "var-size * window-image-width / 2";
var-hh = "var-size * window-image-height / 2";
var-c = "cos(var-phi)";
var-s = "sin(var-phi)";
scale-x = "window-image-width / window-width";
scale-y = "window-image-height / window-height";
corner-top-left-x = "var-cx - var-hw * var-c + var-hh * var-s - window-x";
corner-top-left-y = "var-cy - var-hw * var-s - var-hh * var-c - window-y";
corner-top-right-x = "var-cx + var-hw * var-c + var-hh * var-s - window-x - window-image-width";
corner-top-right-y = "var-cy + var-hw * var-s - var-hh * var-c - window-y";
corner-bottom-left-x = "var-cx - var-hw * var-c - var-hh * var-s - window-x";
corner-bottom-left-y = "var-cy - var-hw * var-s + var-hh * var-c - window-y - window-image-height";
corner-bottom-right-x = "var-cx + var-hw * var-c - var-hh * var-s - window-x - window-image-width";
corner-bottom-right-y = "var-cy + var-hw * var-s + var-hh * var-c - window-y - window-image-height";
crop-x = "plugin-ws-direction-monitor-x";
crop-y = "plugin-ws-direction-monitor-y";
crop-width = "plugin-ws-direction-monitor-width";
crop-height = "plugin-ws-direction-monitor-height";
