# Not a style: the switch styles include this through parts/switch.conf, and wall.conf
# and unfold.conf through parts/overview.conf. It says which way the workspaces of a
# monitor lie, the same for every style, so that a switch and the overview agree. To
# change it for all styles, copy this file to ws-direction/parts/ next to picom.conf.
#   var-axis     0: along the short side of the monitor, up and down on a landscape one
#                and sideways on a portrait or square one; 1: always sideways; 2: always
#                up and down
#   var-reverse  1: a higher workspace lies below (or right of) a lower one, so going to
#                it, it comes from below (or from the right); -1: above (or left)
# It sets var-sideways: 1 where the workspaces lie sideways, 0 where they lie up and down;
# and var-on-strip, 1: every style that includes this puts the window on the strip of
# workspaces with var-pos, so a switch that interrupts its animation can go on from
# var-pos-before (parts/switch.conf). An animation without it, from another rule, has
# var-on-strip-before 0.

var-axis = 0;
var-reverse = 1;
var-sideways = "max(0, 1 - var-axis) * min(1, floor(plugin-ws-direction-monitor-height / plugin-ws-direction-monitor-width)) + max(0, 1 - abs(var-axis - 1))";
var-on-strip = 1;
