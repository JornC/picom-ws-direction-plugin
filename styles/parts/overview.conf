# Not a style: wall.conf and unfold.conf include this in their parts. To change it for
# both, copy this file to ws-direction/parts/ next to picom.conf.
#   var-fill     how much of the monitor the unfolded workspaces take, along the strip
#   var-dim      the opacity of the workspaces the monitor doesn't show, as a share of
#                their own
# It also sets var-middle, the middle of the strip, in workspaces, and var-is-shown, 1 for
# the workspace the monitor shows and 0 for the others; and the crop, to the monitor.
# parts/axis.conf, which this includes, says which way the workspaces lie.

@include "ws-direction/parts/axis.conf"
var-fill = 0.92;
var-dim = 0.7;
var-middle = "(plugin-ws-direction-faces - 1) / 2";
var-is-shown = "max(0, 1 - abs(plugin-ws-direction-index - plugin-ws-direction-shown))";
crop-x = "plugin-ws-direction-monitor-x";
crop-y = "plugin-ws-direction-monitor-y";
crop-width = "plugin-ws-direction-monitor-width";
crop-height = "plugin-ws-direction-monitor-height";
