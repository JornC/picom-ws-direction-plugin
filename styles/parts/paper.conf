# Not a style: paper.conf includes this in each of its parts. Each workspace is a flat
# sheet the size of the monitor, var-pos monitors along the strip as in slide.conf. While
# it moves it leans into the way it goes, its leading edge back, by up to var-tilt
# radians halfway through a switch (var-lean), and lies flat as it stops. A switch that
# interrupts one starts from the lean it had. The sheet is pushed back by as much as its
# edge that comes forward would come out (var-back), so it is never drawn larger. The eye
# is var-camera sides of the sheet from the monitor, in front of its middle.
var-side = "var-sideways * plugin-ws-direction-monitor-width + (1 - var-sideways) * plugin-ws-direction-monitor-height";
var-mid-x = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
var-mid-y = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
var-d = "var-camera * var-side";
var-dir = "var-reverse * (var-end - var-start) / max(0.001, abs(var-end - var-start))";
var-lean = "var-dir * var-tilt * sin(pi * var-q) ^ 2 * var-slide + var-lean-before * (2 * var-q ^ 3 - 3 * var-q ^ 2 + 1)";
var-sin = "sin(var-lean)";
var-cos = "cos(var-lean)";
var-back = "var-side / 2 * abs(var-sin)";
var-pan = "var-reverse * var-pos * var-side";

var-tl-u = "var-sideways * (window-x - var-mid-x) + (1 - var-sideways) * (window-y - var-mid-y)";
var-tl-v = "var-sideways * (window-y - var-mid-y) + (1 - var-sideways) * (window-x - var-mid-x)";
var-tl-k = "var-d / (var-d + var-back + var-tl-u * var-sin)";
var-tl-du = "(var-pan + var-tl-u * var-cos) * var-tl-k - var-tl-u";
var-tl-dv = "var-tl-v * (var-tl-k - 1)";
corner-top-left-x = "var-sideways * var-tl-du + (1 - var-sideways) * var-tl-dv";
corner-top-left-y = "var-sideways * var-tl-dv + (1 - var-sideways) * var-tl-du";

var-tr-u = "var-sideways * (window-x + window-width - var-mid-x) + (1 - var-sideways) * (window-y - var-mid-y)";
var-tr-v = "var-sideways * (window-y - var-mid-y) + (1 - var-sideways) * (window-x + window-width - var-mid-x)";
var-tr-k = "var-d / (var-d + var-back + var-tr-u * var-sin)";
var-tr-du = "(var-pan + var-tr-u * var-cos) * var-tr-k - var-tr-u";
var-tr-dv = "var-tr-v * (var-tr-k - 1)";
corner-top-right-x = "var-sideways * var-tr-du + (1 - var-sideways) * var-tr-dv";
corner-top-right-y = "var-sideways * var-tr-dv + (1 - var-sideways) * var-tr-du";

var-bl-u = "var-sideways * (window-x - var-mid-x) + (1 - var-sideways) * (window-y + window-height - var-mid-y)";
var-bl-v = "var-sideways * (window-y + window-height - var-mid-y) + (1 - var-sideways) * (window-x - var-mid-x)";
var-bl-k = "var-d / (var-d + var-back + var-bl-u * var-sin)";
var-bl-du = "(var-pan + var-bl-u * var-cos) * var-bl-k - var-bl-u";
var-bl-dv = "var-bl-v * (var-bl-k - 1)";
corner-bottom-left-x = "var-sideways * var-bl-du + (1 - var-sideways) * var-bl-dv";
corner-bottom-left-y = "var-sideways * var-bl-dv + (1 - var-sideways) * var-bl-du";

var-br-u = "var-sideways * (window-x + window-width - var-mid-x) + (1 - var-sideways) * (window-y + window-height - var-mid-y)";
var-br-v = "var-sideways * (window-y + window-height - var-mid-y) + (1 - var-sideways) * (window-x + window-width - var-mid-x)";
var-br-k = "var-d / (var-d + var-back + var-br-u * var-sin)";
var-br-du = "(var-pan + var-br-u * var-cos) * var-br-k - var-br-u";
var-br-dv = "var-br-v * (var-br-k - 1)";
corner-bottom-right-x = "var-sideways * var-br-du + (1 - var-sideways) * var-br-dv";
corner-bottom-right-y = "var-sideways * var-br-dv + (1 - var-sideways) * var-br-du";

crop-x = "plugin-ws-direction-monitor-x";
crop-y = "plugin-ws-direction-monitor-y";
crop-width = "plugin-ws-direction-monitor-width";
crop-height = "plugin-ws-direction-monitor-height";
