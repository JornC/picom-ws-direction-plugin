# Not a style: pop.conf includes this in each of its parts. A window var-far workspaces
# from the view (var-pos) is drawn at var-size of its picture's own size, around its
# middle, and at var-shown of its opacity: as it is in the view, and var-small and gone
# var-gone of a workspace away. Both change at an even pace over that distance: a change
# that starts or stops between two frames would show as a jump when a switch interrupts
# another there. Its blur fades with it, so a window that has gone draws nothing.
# A window that the switch carries from one side of the view to the other (var-start and
# var-end on either side) peaks round, as 1 - u^2 of its distance u in var-gone: a corner
# at the view, crossed between two frames, shows as a jump. One that starts or ends in
# the view keeps the corner, so it leaves at once. The shape goes over smoothly from the
# animation a switch interrupts (var-cap-before).
var-cap-own = "min(1, max(0, ceil(0 - var-start * var-end - 0.000001)))";
var-cap0 = "var-carried * var-cap-before + (1 - var-carried) * var-cap-own";
var-cap = "var-cap0 + (var-cap-own - var-cap0) * var-q * var-q * (3 - 2 * var-q)";
var-far = "abs(var-pos)";
var-near = "max(0, 1 - var-far / var-gone) * (1 + var-cap * min(1, var-far / var-gone))";
var-size = "var-small + (1 - var-small) * var-near";
var-shown = "var-near";
blur-opacity = "window-blur-opacity * var-shown";
scale-x = "var-size * window-image-width / window-width";
scale-y = "var-size * window-image-height / window-height";
offset-x = "(window-width - var-size * window-image-width) / 2";
offset-y = "(window-height - var-size * window-image-height) / 2";
crop-x = "plugin-ws-direction-monitor-x";
crop-y = "plugin-ws-direction-monitor-y";
crop-width = "plugin-ws-direction-monitor-width";
crop-height = "plugin-ws-direction-monitor-height";
