# Not a style: cube.conf, flip.conf and unfold.conf include this, so that the box that
# unfolds is the box that turns. To change it for all three, copy this file to
# ws-direction/parts/ next to picom.conf.
#   var-n        how many sides the box of cube and unfold has: 4, or one per workspace
#                if the monitor has more
#   var-camera   how far the eye is from the monitor, in sides (a side is the monitor's
#                size along the turn: its height when it turns up and down, its width
#                when it turns sideways); less is a stronger perspective
#   var-eye-mm   how far your eyes are from the monitor, in millimetres: with it, the box
#                is seen as from there, from the monitor's size that RandR gives
#                (plugin-ws-direction-monitor-width-mm and -height-mm). 0 (the default),
#                or a monitor whose size RandR doesn't know, uses var-camera

var-n = "max(4, plugin-ws-direction-faces)";
var-camera = 1.5;
var-eye-mm = 0;
