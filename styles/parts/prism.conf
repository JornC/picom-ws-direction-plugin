# Not a style: cube.conf and flip.conf include this in each of their parts. It puts the
# workspaces of a monitor on the sides of a prism that turns about an axis across the
# monitor (parts/prism-view.conf draws it), and moves the prism back while it turns in a
# switch, so that the side in front stays on the monitor.
#
# The part that includes it sets:
#   var-pos       where the window's workspace is on the prism, in sides from the one in
#                 front: it turns var-pos * 360 / var-sides degrees from the front
#   var-sides     how many sides the prism has; 2 is a card that flips over
#   var-fit       how far the prism moves back while it turns, as a share of what the
#                 side in front needs to stay on the monitor: 1 is just that, more is a
#                 margin, less lets the side leave the monitor, 0 doesn't move back
# and includes parts/switch.conf (var-dip, var-sideways) and parts/box.conf (var-camera)
# itself. It uses var-drawn (see prism-view.conf). The part also sets the crop. This
# file and prism-view.conf set the corner-* outputs and the var-* below, so a part must
# not set them.
#
# What a side turned by an angle a needs: its corners along the turn stay within half a
# side of the middle (2 |lateral| d / side - d - depth for each), and its edge that comes
# forward stays behind the monitor (minus its depth). Over the angles from 0 to a, the
# most of these is var-need of a, in closed form: each is A cos + B sin - C of the angle,
# whose most up to a is A max(cos a, A / R) + B min(sin a, B / R) - C, R = sqrt(A^2 + B^2)
# (with A and B below 0 taken as 0 in R, where the most is at one end). Halfway between
# two sides the side in front is turned by h = 180 / var-sides degrees (var-h); in
# between by less. The box takes the need of h sin(180 |frac|) degrees, frac being how
# far var-pos is from a side: at least the angle of the side in front, and the same at
# the halfway point from both sides, so the box doesn't change direction there with a
# jolt. In a switch it also stays back by the need of h times var-dip, which keeps it
# back while it passes sides; both start and end without speed (var-pos starts and ends
# without speed). Where the two cross, the larger of them would change speed at once, so
# the box takes a smooth bound above both instead: never less than either, and at most
# var-round (a share) of the larger one further back, where they cross. So var-fit 1
# keeps the side in front on the monitor for every pose and any number of sides, at most
# var-round further back than it needs.

@include "ws-direction/parts/prism-view.conf"
var-turn = "var-h * sin(pi * abs(var-pos - round(var-pos)))";
var-ka = "var-d + var-r";
var-kb = "abs(2 * var-r * var-d / var-side - var-side / 2)";
var-kr = "sqrt(var-ka ^ 2 + var-kb ^ 2)";
var-ia = "var-r - var-d";
var-ib = "2 * var-r * var-d / var-side + var-side / 2";
var-ir = "sqrt(max(0, var-ia) ^ 2 + var-ib ^ 2)";
var-need = "max(0, max(max(var-ka * max(cos(var-h), var-ka / var-kr) + var-kb * min(sin(var-h), var-kb / var-kr) - var-ka, var-ia * max(cos(var-h), max(0, var-ia) / var-ir) + var-ib * min(sin(var-h), var-ib / var-ir) - var-ka), var-r * cos(var-h) + var-side / 2 * sin(var-h) - var-r))";
var-need-now = "max(0, max(max(var-ka * max(cos(var-turn), var-ka / var-kr) + var-kb * min(sin(var-turn), var-kb / var-kr) - var-ka, var-ia * max(cos(var-turn), max(0, var-ia) / var-ir) + var-ib * min(sin(var-turn), var-ib / var-ir) - var-ka), var-r * cos(var-turn) + var-side / 2 * sin(var-turn) - var-r))";
var-round = 0.2;
var-back-now = "var-need-now";
var-back-dip = "var-need * var-dip";
var-back = "var-fit * (var-back-now + var-back-dip + sqrt((var-back-now - var-back-dip) ^ 2 + (var-round * (var-back-now + var-back-dip)) ^ 2)) / 2";
var-pan = 0;
