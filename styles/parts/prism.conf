# Not a style: cube.conf and flip.conf include this in each of their parts. It puts the
# workspaces of a monitor on the sides of a prism that turns about an axis across the
# monitor, and moves the four corners of every window to where they are seen in
# perspective. picom draws a window whose corners moved in perspective, and doesn't draw
# it while its back is turned.
#
# The part that includes it sets:
#   var-pos       where the window's workspace is on the prism, in sides from the one in
#                 front: it turns var-pos * 360 / var-sides degrees from the front
#   var-sides     how many sides the prism has; 2 is a card that flips over
#   var-fit       how far the prism moves back while it turns, as a share of what the
#                 side in front needs to stay on the monitor: 1 is just that, more is a
#                 margin, less lets the side leave the monitor, 0 doesn't move back
# and uses var-drawn: 1 if the window is drawn on the prism, 0 if another workspace has
# that side (when the prism has fewer sides than the monitor has workspaces, only the
# workspaces less than half a turn from the front are drawn). The part also sets the
# crop. This file sets the corner-* outputs and the var-* below, so a part must not set
# them. tests/check-frames.py reads var-pos, var-sides, var-sideways, var-d, var-back,
# var-r and var-cos from picom's frame log: keep those names.
#
# The math: u is a corner's place along the turn and v across it, from the middle of the
# monitor. The front side is at depth 0, the axis var-r behind it. A corner of a side
# turned by angle a is at (u cos a + r sin a, v) and depth back + r (1 - cos a) + u sin a,
# and the eye at var-d in front of the monitor sees it at d / (d + depth) of that. The
# corner outputs are where it is seen minus where the corner is. Halfway between two
# sides, each is turned by half a step, h = 180 / var-sides degrees. Then their outer
# edges are at side * cos h along the turn, at depth side / 2 * (cos h - cos 2h) / sin h,
# and the edge they share comes forward by side / 2 * tan(h / 2). var-need is how far
# back the prism must be for both to stay on the monitor.

var-side = "var-sideways * plugin-ws-direction-monitor-width + (1 - var-sideways) * plugin-ws-direction-monitor-height";
var-mid-x = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
var-mid-y = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
var-h = "pi / var-sides";
var-r = "var-side / 2 / tan(var-h)";
var-d = "var-camera * var-side";
var-turn = "var-h * sin(pi * abs(var-pos - round(var-pos)))";
var-ka = "var-d + var-r";
var-kb = "abs(2 * var-r * var-d / var-side - var-side / 2)";
var-kr = "sqrt(var-ka ^ 2 + var-kb ^ 2)";
var-ia = "var-r - var-d";
var-ib = "2 * var-r * var-d / var-side + var-side / 2";
var-ir = "sqrt(max(0, var-ia) ^ 2 + var-ib ^ 2)";
var-need = "max(0, max(max(var-ka * max(cos(var-h), var-ka / var-kr) + var-kb * min(sin(var-h), var-kb / var-kr) - var-ka, var-ia * max(cos(var-h), max(0, var-ia) / var-ir) + var-ib * min(sin(var-h), var-ib / var-ir) - var-ka), var-r * cos(var-h) + var-side / 2 * sin(var-h) - var-r))";
var-need-now = "max(0, max(max(var-ka * max(cos(var-turn), var-ka / var-kr) + var-kb * min(sin(var-turn), var-kb / var-kr) - var-ka, var-ia * max(cos(var-turn), max(0, var-ia) / var-ir) + var-ib * min(sin(var-turn), var-ib / var-ir) - var-ka), var-r * cos(var-turn) + var-side / 2 * sin(var-turn) - var-r))";
var-round = 0.2;
var-back-now = "var-need-now";
var-back-dip = "var-need * var-dip";
var-back = "var-fit * (var-back-now + var-back-dip + sqrt((var-back-now - var-back-dip) ^ 2 + (var-round * (var-back-now + var-back-dip)) ^ 2)) / 2";
var-a = "2 * pi * var-pos / var-sides";
var-sin = "sin(var-a)";
var-cos = "cos(var-a)";
var-drawn = "max(min(1, max(0, var-sides + 1 - plugin-ws-direction-faces)), max(0, min(1, (var-sides / 2 - abs(var-pos)) * 1000)))";

var-tl-u = "var-sideways * (window-x - var-mid-x) + (1 - var-sideways) * (window-y - var-mid-y)";
var-tl-v = "var-sideways * (window-y - var-mid-y) + (1 - var-sideways) * (window-x - var-mid-x)";
var-tl-k = "var-d / (var-d + var-back + var-r * (1 - var-cos) + var-tl-u * var-sin)";
var-tl-du = "(var-tl-u * var-cos + var-r * var-sin) * var-tl-k - var-tl-u";
var-tl-dv = "var-tl-v * (var-tl-k - 1)";
corner-top-left-x = "var-sideways * var-tl-du + (1 - var-sideways) * var-tl-dv";
corner-top-left-y = "var-sideways * var-tl-dv + (1 - var-sideways) * var-tl-du";

var-tr-u = "var-sideways * (window-x + window-width - var-mid-x) + (1 - var-sideways) * (window-y - var-mid-y)";
var-tr-v = "var-sideways * (window-y - var-mid-y) + (1 - var-sideways) * (window-x + window-width - var-mid-x)";
var-tr-k = "var-d / (var-d + var-back + var-r * (1 - var-cos) + var-tr-u * var-sin)";
var-tr-du = "(var-tr-u * var-cos + var-r * var-sin) * var-tr-k - var-tr-u";
var-tr-dv = "var-tr-v * (var-tr-k - 1)";
corner-top-right-x = "var-sideways * var-tr-du + (1 - var-sideways) * var-tr-dv";
corner-top-right-y = "var-sideways * var-tr-dv + (1 - var-sideways) * var-tr-du";

var-bl-u = "var-sideways * (window-x - var-mid-x) + (1 - var-sideways) * (window-y + window-height - var-mid-y)";
var-bl-v = "var-sideways * (window-y + window-height - var-mid-y) + (1 - var-sideways) * (window-x - var-mid-x)";
var-bl-k = "var-d / (var-d + var-back + var-r * (1 - var-cos) + var-bl-u * var-sin)";
var-bl-du = "(var-bl-u * var-cos + var-r * var-sin) * var-bl-k - var-bl-u";
var-bl-dv = "var-bl-v * (var-bl-k - 1)";
corner-bottom-left-x = "var-sideways * var-bl-du + (1 - var-sideways) * var-bl-dv";
corner-bottom-left-y = "var-sideways * var-bl-dv + (1 - var-sideways) * var-bl-du";

var-br-u = "var-sideways * (window-x + window-width - var-mid-x) + (1 - var-sideways) * (window-y + window-height - var-mid-y)";
var-br-v = "var-sideways * (window-y + window-height - var-mid-y) + (1 - var-sideways) * (window-x + window-width - var-mid-x)";
var-br-k = "var-d / (var-d + var-back + var-r * (1 - var-cos) + var-br-u * var-sin)";
var-br-du = "(var-br-u * var-cos + var-r * var-sin) * var-br-k - var-br-u";
var-br-dv = "var-br-v * (var-br-k - 1)";
corner-bottom-right-x = "var-sideways * var-br-du + (1 - var-sideways) * var-br-dv";
corner-bottom-right-y = "var-sideways * var-br-dv + (1 - var-sideways) * var-br-du";
