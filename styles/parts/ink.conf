# Not a style: ink.conf includes this in each of its parts. A window is a block of its
# mean colour, in its own place, with i3's frame on its edges. Its picture, at var-ps of
# its own size, sits in the middle. picom can't fade a picture over its own fill, so the
# picture shrinks into the colour rather than fades. How far the switch has come in time
# (var-q, from 0 to 1) sets both. A window that leaves the view drains its picture early
# and keeps its block until late; one that comes gets its block early, and its picture
# comes out late. The old and the new block of a place never both fade much at once: at
# most an eighth of a percent of what lies behind shows through. A window that neither
# starts nor ends in the view, as one the switch passes, isn't drawn.
#
# Each part changes from the start of the animation, not from a point on the way (a
# change that starts between two frames shows as a jump when a switch interrupts another
# there), and comes to rest at its end. A switch that interrupts another goes on from the
# picture size and the fade the window had (var-ps-before, var-shown-before).
var-ink = 1;
var-in-start = "max(0, 1 - ceil(abs(var-start) - 0.5))";
var-in-end = "max(0, 1 - ceil(abs(var-end) - 0.5))";
var-shown0 = "var-ink-before * var-shown-before + (1 - var-ink-before) * var-in-start";
var-shown-up = "min(1, max(0, ceil(var-in-end - var-shown0 - 0.000001)))";
var-shown = "var-shown0 + (var-in-end - var-shown0) * (var-shown-up * (1 - (1 - var-q) ^ 4) + (1 - var-shown-up) * var-q ^ 6)";
var-ps1 = "0.01 + 0.99 * var-in-end";
var-ps0 = "var-ink-before * var-ps-before + (1 - var-ink-before) * (0.01 + 0.99 * var-in-start)";
var-ps-up = "min(1, max(0, ceil(var-ps1 - var-ps0 - 0.000001)))";
var-ps = "var-ps0 + (var-ps1 - var-ps0) * (var-ps-up * var-q * var-q * (3 - 2 * var-q) + (1 - var-ps-up) * (1 - (1 - var-q) ^ 4))";
blur-opacity = "window-blur-opacity * var-shown";
scale-x = "var-ps * window-image-width / window-width";
scale-y = "var-ps * window-image-height / window-height";
offset-x = "(window-width - var-ps * window-image-width) / 2";
offset-y = "(window-height - var-ps * window-image-height) / 2";
var-x0 = "max(window-x, plugin-ws-direction-monitor-x)";
var-y0 = "max(window-y, plugin-ws-direction-monitor-y)";
crop-x = "var-x0";
crop-y = "var-y0";
crop-width = "max(0, min(window-x + window-width, plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width) - var-x0)";
crop-height = "max(0, min(window-y + window-height, plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height) - var-y0)";
frame-on-crop = 1;
fill = "window-median-known * window-median-alpha";
fill-red = "window-median-red";
fill-green = "window-median-green";
fill-blue = "window-median-blue";
