# Pass-zoom-cascade: pass-zoom-pan, but the windows of the new workspace cascade in. The
# view zooms out and pans along the workspaces as tiles with a gap between them; the old
# workspace and the ones passed move in one piece, and the windows of the new one trail
# behind it one after another, across the monitor (left to right, or top to bottom), and
# all land as the view zooms back in.
#
# Needs the ws-direction plugin, which declares and starts ws-pass; see pass-zoom-pan.conf
# for how ws-pass draws the hidden workspaces.
#
# The zoom and the pan are pass-zoom-pan's (parts/zoom.conf): a window at x lands at
# mx + k * (x + pan - mx), and each window moves from var-face to var-face - var-travel. A
# window of the new workspace waits var-wait first and then moves faster, so it still
# lands on time. var-wait is up to var-trail of the switch, in proportion to where the
# window sits, divided by how many workspaces the switch moves, so the new windows trail
# the strip by about as much in a long switch as in a short one. In ws-pass, var-new is 1
# for a window of the new workspace (var-face = var-travel) and 0 for the others, whose
# faces are whole numbers at least one away from it.
#
# A switch that comes while one runs carries on from where the windows are: var-pos is a
# window's place relative to the view, which means the same in both switches, and
# parts/switch.conf starts each window from where it was (var-pos-before). The plugin
# starts ws-pass on every window of the monitor, so all of them carry over. The zoom
# (var-dip) goes on from where it is. A window of the new workspace that was moving
# already doesn't wait again (var-moving); one that still waited, waits.
#
# Settings, in each of the three parts: var-length is how long a switch to the next
# workspace takes, in seconds; var-pass-growth is how much of var-length each workspace
# passed adds; var-trail is how much of a switch the last new window waits. var-zoom and
# var-gap are in parts/zoom.conf; var-axis, var-reverse, var-other-time and var-wrap in
# parts/axis.conf and parts/switch.conf, shared by all switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  var-trail = 0.65;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/zoom.conf"
  var-wait = "var-trail * var-time * var-slide / (abs(var-travel) + 1 - var-slide) * ((1 - var-sideways) * (window-x - plugin-ws-direction-monitor-x) / plugin-ws-direction-monitor-width + var-sideways * (window-y - plugin-ws-direction-monitor-y) / plugin-ws-direction-monitor-height) * (1 - var-moving)";
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "var-start"; end = "var-end"; reset = true; };
  var-k = "1 - var-zoom * var-dip";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  var-trail = 0.65;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/zoom.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-k = "1 - var-zoom * var-dip";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  var-trail = 0.65;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/zoom.conf"
  var-new = "max(0, 1 - abs(var-face - var-travel))";
  var-wait = "var-trail * var-time * var-slide * var-new / (abs(var-travel) + 1 - var-slide) * ((1 - var-sideways) * (window-x - plugin-ws-direction-monitor-x) / plugin-ws-direction-monitor-width + var-sideways * (window-y - plugin-ws-direction-monitor-y) / plugin-ws-direction-monitor-height) * (1 - var-moving)";
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "var-start"; end = "var-end"; reset = true; };
  var-k = "1 - var-zoom * var-dip";
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * var-slide";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
