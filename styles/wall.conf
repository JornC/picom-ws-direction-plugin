# Wall: an overview of the workspaces of a monitor. When it unfolds, the view zooms out
# along the strip of workspaces that pass-zoom-pan slides through, until all of the
# monitor's workspaces fit, and holds there. The workspace the monitor shows stays bright,
# the others are dimmed. Switch workspaces while it is open, and the bright one follows.
# When it folds, the view zooms back in on the workspace the monitor shows.
#
# It only animates the triggers ws-unfold and ws-fold (the plugin declares them), so use
# it next to a style for workspace switches, in a second rule with the same match:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/pass-zoom-pan.conf"
#   }, {
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/wall.conf"
#   });
#
# The plugin starts ws-unfold on every window of the focused monitor on
# "ws-direction overview open" (or toggle), again on every switch on that monitor while it
# is open, and ws-fold on "ws-direction overview close", or when a click picks a window.
# For a window of another workspace, ws-fold starts together with the switch to it, so
# plugin-ws-direction-shown is the picked workspace already; var-pos and var-bright carry
# over from the held pose, so the fold zooms into it without a jump. See the README for
# i3 key bindings. Hidden windows are drawn from their kept images, which this style
# keeps (keep-image-when-hidden).
#
# The workspaces lie on the strip of pass-zoom-pan, var-gap of a monitor apart, the way
# parts/axis.conf says (as in the switch styles). var-pos is a window's place on the
# strip, in workspaces, from the view: index - shown when folded (the shown workspace is
# in view), index - (faces - 1) / 2 when unfolded (the middle of the strip is in view).
# The zoom, var-k, goes from 1 (folded) to var-k-wall (unfolded), at which all faces fit
# in var-fill of the monitor. A window at x lands at mx + k * (x + pan - mx)
# (parts/zoom.conf). var-bright is 1 for the shown workspace and 0 for the others; the
# others get var-dim of their opacity, or of their brightness with var-darken 1. All
# three carry over when one animation interrupts another, so unfolding, switching and
# folding in quick succession stay smooth, and unfolding during a switch of a zoom style
# goes on from its zoom and place.
# ws-unfold holds its end pose (hold), and suppresses show, hide, geometry and ws-pass, so
# the windows that i3 shows and hides in a switch keep their place in the overview.
#
# var-length is how long unfolding and folding take, in seconds; set it in both parts.
# var-fill, var-dim and var-darken are in parts/overview.conf, shared with unfold.conf;
# var-gap in parts/zoom.conf, shared with the zoom styles; var-axis and var-reverse in
# parts/axis.conf, shared by all styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["ws-unfold"];
  suppressions = ["show", "hide", "geometry", "ws-pass"];
  var-length = 0.35;
  @include "ws-direction/parts/overview.conf"
  @include "ws-direction/parts/zoom.conf"
  var-k-wall = "var-fill / (plugin-ws-direction-faces * (1 + var-gap) - var-gap)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = "plugin-ws-direction-index - plugin-ws-direction-shown"; end = "plugin-ws-direction-index - var-middle"; };
  var-bright = { curve = "linear"; duration = "var-length"; start = 1; end = "var-is-shown"; };
  var-k = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = 1; end = "var-k-wall"; };
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * var-shade-opacity";
  hold = 1;
}, {
  triggers = ["ws-fold"];
  suppressions = ["show", "hide", "geometry", "ws-pass"];
  var-length = 0.35;
  @include "ws-direction/parts/overview.conf"
  @include "ws-direction/parts/zoom.conf"
  var-k-wall = "var-fill / (plugin-ws-direction-faces * (1 + var-gap) - var-gap)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = "plugin-ws-direction-index - var-middle"; end = "plugin-ws-direction-index - plugin-ws-direction-shown"; };
  var-bright = { curve = "linear"; duration = "var-length"; start = "var-is-shown"; end = 1; };
  var-k = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = "var-k-wall"; end = 1; };
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * var-shade-opacity";
});
