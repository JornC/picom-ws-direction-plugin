# Ink: on a workspace switch the windows of the old workspace turn into blocks of their
# own mean colour, their pictures draining into their middles, and the blocks fade; those
# of the new one come as blocks of their colour, and then their content comes out of the
# middle. It goes with win-cause's ink. A window whose mean colour picom doesn't know yet
# has no block: only its picture drains. Needs a picom with fill, the mean colour
# (window-median-*), frame-on-crop and window-image-width.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded, as slide.conf. It
# puts the windows on the strip of workspaces as slide does (var-pos), through ws-pass,
# but they stay in their places: how far the switch has come sets how far a picture has
# drained and how far a block has faded (parts/ink.conf).
#
# Settings, in each of the three parts: var-length and var-pass-growth as in slide.conf.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.5;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  opacity = "var-fade * var-shown";
  @include "ws-direction/parts/ink.conf"
}, {
  triggers = ["hide"];
  var-length = 0.5;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  opacity = "var-fade * var-shown";
  @include "ws-direction/parts/ink.conf"
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.5;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide * var-shown";
  @include "ws-direction/parts/ink.conf"
});
