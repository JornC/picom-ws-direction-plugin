# Pass-slide: slide, but a switch that passes workspaces shows them on the way. Going
# from 1 to 4, the windows of 2 and 3 slide by between the old and the new workspace.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/pass-slide.conf"
#   });
#
# The windows in between are hidden, so the style keeps their images while they are
# hidden (keep-image-when-hidden), and draws them from those. That takes memory, and a
# workspace picom has not shown since it started has no images yet; see the README.
#
# Every window of a switch moves var-travel monitors (the plugin's direction *
# distance), in the same time and on the same curve, so the workspaces move as one
# strip. The plugin starts ws-pass on all of them in one frame, and the ws-pass part
# moves each one from var-face to var-face - var-travel: the old workspace from 0, the
# new one to 0, and the ones in between from their own face. It suppresses show and
# hide, which the window manager can send a frame later. A hidden window has opacity 0,
# so ws-pass draws it with window-mapped-opacity, and not at all when its place is on
# another monitor (placed is 0). The show and hide parts make the same move for a window
# that picom has no image of yet, which ws-pass can't draw.
#
# Settings, in each of the three parts: var-length is how long a switch to the next
# workspace takes, in seconds; var-pass-growth is how much of var-length each workspace
# passed adds, so a long switch doesn't become a blur. Which way the workspaces lie
# (var-axis, var-reverse), the fade of windows outside a switch (var-other-time; ws-pass
# draws nothing outside a switch, where only StartAnimations can start it) and whether
# the workspaces lie on a ring (var-wrap) are in parts/axis.conf and parts/switch.conf,
# shared by all switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.25;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  offset-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-length = 0.25;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  offset-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.25;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  offset-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * var-slide";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
