# Wipe: nothing moves. Going to a higher workspace, a straight edge sweeps up from the
# bottom (or in from the right) and uncovers the new workspace; going back it sweeps the
# other way. Each side is cropped to its part of the monitor: the new workspace to the
# part already uncovered, the old one to the rest. var-p goes from 0 to 1.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/wipe.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-slide is 1 for a workspace switch and 0
# otherwise; then the window gets a short fade. var-sideways is 1 on a portrait monitor
# and 0 on a landscape one: the workspaces move along the short side of the monitor. On a
# square monitor it is 0.5, and they move diagonally.

animations = ({
  triggers = ["show", "open"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-length = 0.3;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-p = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "1 - var-slide"; end = 1; };
  var-from = "(1 + workspace-direction) / 2";
  crop-x = "workspace-monitor-x + var-sideways * workspace-monitor-width * (1 - var-p) * var-from";
  crop-y = "workspace-monitor-y + (1 - var-sideways) * workspace-monitor-height * (1 - var-p) * var-from";
  crop-width = "workspace-monitor-width * (1 - var-sideways * (1 - var-p))";
  crop-height = "workspace-monitor-height * (1 - (1 - var-sideways) * (1 - var-p))";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
}, {
  triggers = ["hide"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-length = 0.3;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-p = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = 0; end = "var-slide"; };
  var-from = "(1 - workspace-direction) / 2";
  crop-x = "workspace-monitor-x + var-sideways * workspace-monitor-width * var-p * var-from";
  crop-y = "workspace-monitor-y + (1 - var-sideways) * workspace-monitor-height * var-p * var-from";
  crop-width = "workspace-monitor-width * (1 - var-sideways * var-p)";
  crop-height = "workspace-monitor-height * (1 - (1 - var-sideways) * var-p)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
});
