# Wipe: nothing moves. Going to a higher workspace, a straight edge sweeps up from the
# bottom (or in from the right) and uncovers the new workspace; going back it sweeps the
# other way.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/wipe.conf"
#   });
#
# Like the pass styles, it moves the windows of every workspace of the monitor in a
# switch, through ws-pass, which the plugin starts on all of them in one frame: that
# keeps the old and the new workspace in step even when the window manager hides one a
# frame after it shows the other, and a switch made while one runs goes on from where
# every window is. The workspaces a switch passes come by on the way. ws-pass draws
# hidden windows from the images picom keeps of them (keep-image-when-hidden), which
# takes memory, and a workspace picom has not shown since it started has no images yet;
# see pass-slide.conf and the README. The show and hide parts make the same move for a
# window that picom has no image of yet, and give a window outside a switch a fade.
#
# The windows stay where they are; what moves is where each workspace shows. var-pos is
# its place on the strip, in monitors from the view, going from var-face to var-face -
# var-travel, and each workspace shows only where the monitor, moved by var-pos, still
# covers the monitor: a share var-share of it, from var-cover. So the workspaces tile the
# monitor along one moving edge, which a switch made while one runs takes on from where
# it is.
#
# Settings, in each of the three parts: var-length is how long a switch takes, in
# seconds; var-pass-growth is how much of var-length each workspace passed adds (0: a
# switch takes var-length however far it goes). Which way the workspaces lie (var-axis,
# var-reverse), the fade of windows outside a switch (var-other-time) and whether they
# lie on a ring (var-wrap) are in parts/axis.conf and parts/switch.conf, shared by all
# switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.3;
  var-pass-growth = 0;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-cover = "max(0, var-reverse * var-pos)";
  var-share = "max(0, 1 - abs(var-pos))";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x + var-sideways * var-cover * plugin-ws-direction-monitor-width";
  crop-y = "plugin-ws-direction-monitor-y + (1 - var-sideways) * var-cover * plugin-ws-direction-monitor-height";
  crop-width = "plugin-ws-direction-monitor-width * (1 - var-sideways * (1 - var-share))";
  crop-height = "plugin-ws-direction-monitor-height * (1 - (1 - var-sideways) * (1 - var-share))";
}, {
  triggers = ["hide"];
  var-length = 0.3;
  var-pass-growth = 0;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-cover = "max(0, var-reverse * var-pos)";
  var-share = "max(0, 1 - abs(var-pos))";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x + var-sideways * var-cover * plugin-ws-direction-monitor-width";
  crop-y = "plugin-ws-direction-monitor-y + (1 - var-sideways) * var-cover * plugin-ws-direction-monitor-height";
  crop-width = "plugin-ws-direction-monitor-width * (1 - var-sideways * (1 - var-share))";
  crop-height = "plugin-ws-direction-monitor-height * (1 - (1 - var-sideways) * (1 - var-share))";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.3;
  var-pass-growth = 0;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-cover = "max(0, var-reverse * var-pos)";
  var-share = "max(0, 1 - abs(var-pos))";
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide";
  crop-x = "plugin-ws-direction-monitor-x + var-sideways * var-cover * plugin-ws-direction-monitor-width";
  crop-y = "plugin-ws-direction-monitor-y + (1 - var-sideways) * var-cover * plugin-ws-direction-monitor-height";
  crop-width = "plugin-ws-direction-monitor-width * (1 - var-sideways * (1 - var-share))";
  crop-height = "plugin-ws-direction-monitor-height * (1 - (1 - var-sideways) * (1 - var-share))";
});
