# Cascade: the slide, but the windows of a workspace start one after another, across the
# monitor (left to right, or top to bottom), and all land together. Each window waits up
# to half of var-length, in proportion to where it sits (var-wait), and then moves faster,
# so they all finish at the same time. The window that hides and the one that shows in
# the same spot wait as long, so they move together.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/cascade.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-slide is 1 for a workspace switch and 0
# otherwise; then the window gets a short fade. var-sideways is 1 on a portrait monitor
# and 0 on a landscape one: the workspaces move along the short side of the monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-length = 0.6;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "0.5 * var-length * var-slide * ((1 - var-sideways) * (window-x - workspace-monitor-x) / workspace-monitor-width + var-sideways * (window-y - workspace-monitor-y) / workspace-monitor-height)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "workspace-direction"; end = 0; };
  offset-x = "var-pos * var-sideways * workspace-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * workspace-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-length = 0.6;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "0.5 * var-length * var-slide * ((1 - var-sideways) * (window-x - workspace-monitor-x) / workspace-monitor-width + var-sideways * (window-y - workspace-monitor-y) / workspace-monitor-height)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = 0; end = "0 - workspace-direction"; };
  offset-x = "var-pos * var-sideways * workspace-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * workspace-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
});
