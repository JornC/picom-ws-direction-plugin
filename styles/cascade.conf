# Cascade: the slide, but the windows of a workspace start one after another, across the
# monitor (left to right, or top to bottom). Each window waits up to 0.15 s, in
# proportion to where it sits (var-wait). The window that hides and the one that shows in
# the same spot wait as long, so they move together.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/cascade.conf"
#   });
#
# var-slide is 1 for a workspace switch and 0 otherwise; then the window gets a short
# fade. var-sideways is 1 on a portrait monitor and 0 on a landscape one: the workspaces
# move along the short side of the monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "0.15 * var-slide * ((1 - var-sideways) * (window-x - workspace-monitor-x) / workspace-monitor-width + var-sideways * (window-y - workspace-monitor-y) / workspace-monitor-height)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time"; start = "workspace-direction"; end = 0; };
  offset-x = "var-pos * var-sideways * workspace-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * workspace-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "workspace-direction ^ 2";
  var-sideways = "1 / (1 + (workspace-monitor-width / workspace-monitor-height) ^ 50)";
  var-time = "0.25 * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "0.15 * var-slide * ((1 - var-sideways) * (window-x - workspace-monitor-x) / workspace-monitor-width + var-sideways * (window-y - workspace-monitor-y) / workspace-monitor-height)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time"; start = 0; end = "0 - workspace-direction"; };
  offset-x = "var-pos * var-sideways * workspace-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * workspace-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "workspace-monitor-x";
  crop-y = "workspace-monitor-y";
  crop-width = "workspace-monitor-width";
  crop-height = "workspace-monitor-height";
});
