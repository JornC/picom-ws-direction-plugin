# Cascade: the old workspace slides out in one piece, and the windows of the new one
# follow it in one after another, across the monitor (left to right, or top to bottom),
# and all land together.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/cascade.conf"
#   });
#
# Like the pass styles, it moves the windows of every workspace of the monitor in a
# switch, through ws-pass, which the plugin starts on all of them in one frame: that
# keeps the old and the new workspace in step even when the window manager hides one a
# frame after it shows the other, and a switch made while one runs goes on from where
# every window is. The workspaces a switch passes come by on the way. ws-pass draws
# hidden windows from the images picom keeps of them (keep-image-when-hidden), which
# takes memory, and a workspace picom has not shown since it started has no images yet;
# see pass-slide.conf and the README. The show and hide parts make the same move for a
# window that picom has no image of yet, and give a window outside a switch a fade.
#
# It moves the workspaces as slide does (var-pos, from var-face to var-face -
# var-travel), but each window of the new workspace (var-new) waits first, up to
# var-trail of var-length in proportion to where it sits (var-wait), and then moves
# faster, so they all finish at the same time. Only the new windows wait, so the old and
# the new layout never cut across each other. In a switch made while one runs, a window
# of the new workspace that was moving already doesn't wait again (var-moving, from
# parts/switch.conf), so it turns back at once; one that still waited, waits.
#
# Settings, in each of the three parts: var-length is how long a switch takes, in
# seconds; var-pass-growth is how much of var-length each workspace passed adds (0: a
# switch takes var-length however far it goes). var-trail is how much of var-length the
# last new window waits. Which way the workspaces lie (var-axis, var-reverse), the fade
# of windows outside a switch (var-other-time) and whether they lie on a ring (var-wrap)
# are in parts/axis.conf and parts/switch.conf, shared by all switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.6;
  var-pass-growth = 0;
  var-trail = 0.5;
  @include "ws-direction/parts/switch.conf"
  var-wait = "var-trail * var-length * var-slide * ((1 - var-sideways) * (window-x - plugin-ws-direction-monitor-x) / plugin-ws-direction-monitor-width + var-sideways * (window-y - plugin-ws-direction-monitor-y) / plugin-ws-direction-monitor-height) * (1 - var-moving)";
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "var-start"; end = "var-end"; reset = true; };
  offset-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-length = 0.6;
  var-pass-growth = 0;
  var-trail = 0.5;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  offset-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.6;
  var-pass-growth = 0;
  var-trail = 0.5;
  @include "ws-direction/parts/switch.conf"
  var-new = "max(0, 1 - abs(var-face - var-travel))";
  var-wait = "var-trail * var-length * var-slide * var-new * ((1 - var-sideways) * (window-x - plugin-ws-direction-monitor-x) / plugin-ws-direction-monitor-width + var-sideways * (window-y - plugin-ws-direction-monitor-y) / plugin-ws-direction-monitor-height) * (1 - var-moving)";
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "var-start"; end = "var-end"; reset = true; };
  offset-x = "var-reverse * var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-reverse * var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
