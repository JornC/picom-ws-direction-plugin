# Cascade: the old workspace slides out as one piece, and the windows of the new one
# follow it in one after another, across the monitor (left to right, or top to bottom),
# and all land together. Each new window waits up to half of var-length, in proportion to
# where it sits (var-wait), and then moves faster, so they all finish at the same time.
# Only the new windows wait, so the old and the new layout never cut across each other.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/cascade.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-slide is 1 for a workspace switch and 0
# otherwise; then the window gets a short fade. var-sideways is 1 on a portrait monitor
# and 0 on a landscape one: the workspaces move along the short side of the monitor. On a
# square monitor it is 0.5, and they move diagonally.

animations = ({
  triggers = ["show", "open"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.6;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-wait = "0.5 * var-length * var-slide * ((1 - var-sideways) * (window-x - plugin-ws-direction-monitor-x) / plugin-ws-direction-monitor-width + var-sideways * (window-y - plugin-ws-direction-monitor-y) / plugin-ws-direction-monitor-height)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; delay = "var-wait"; duration = "var-time - var-wait"; start = "plugin-ws-direction-direction"; end = 0; };
  offset-x = "var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.6;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = 0; end = "0 - plugin-ws-direction-direction"; };
  offset-x = "var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
