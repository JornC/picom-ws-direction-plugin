# Paper: on a workspace switch the workspace slides away like a sheet of paper on a desk,
# leaning slightly into the way it goes, its leading edge back, and the new one slides in
# behind it in the same way, from the side the switch comes from. Both lie flat again as
# they stop. It goes with win-cause's paper. Needs a picom with the corner outputs.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded, as slide.conf. Each
# window moves as in slide.conf (var-pos, from var-face to var-face - var-travel), and
# the windows of a workspace lean together, as one sheet (parts/paper.conf).
#
# Settings, in each of the three parts: var-length and var-pass-growth as in slide.conf;
# var-tilt, how far a sheet leans at most, in radians; var-camera, how far the eye is
# from the monitor, in sheets.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.35;
  var-pass-growth = 0;
  var-tilt = 0.15;
  var-camera = 2;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  opacity = "var-fade";
  @include "ws-direction/parts/paper.conf"
}, {
  triggers = ["hide"];
  var-length = 0.35;
  var-pass-growth = 0;
  var-tilt = 0.15;
  var-camera = 2;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  opacity = "var-fade";
  @include "ws-direction/parts/paper.conf"
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.35;
  var-pass-growth = 0;
  var-tilt = 0.15;
  var-camera = 2;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide";
  @include "ws-direction/parts/paper.conf"
});
