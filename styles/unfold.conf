# Unfold: an overview of the workspaces of a monitor, for cube.conf. When it unfolds, the
# box of workspaces opens up: the side in front stays, the sides next to it swing forward
# at the edges they share, until all of the monitor's workspaces lie flat side by side.
# Meanwhile the view moves back until they fit, and holds there. The workspace the monitor
# shows stays bright, the others are dimmed. Switch workspaces while it is open, and the
# bright one follows. When it folds, the strip closes into the box again, with the
# workspace the monitor shows in front.
#
# It only animates the triggers ws-unfold and ws-fold (the plugin declares them), so use
# it next to cube.conf, in a second rule with the same match:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/cube.conf"
#   }, {
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/unfold.conf"
#   });
#
# The plugin starts ws-unfold on every window of the focused monitor on
# "ws-direction overview open" (or toggle), again on every switch on that monitor while it
# is open, and ws-fold on "ws-direction overview close", or when a click picks a window.
# For a window of another workspace, ws-fold starts together with the switch to it, so
# plugin-ws-direction-shown is the picked workspace already; var-pos and var-bright carry
# over from the held pose, so the fold zooms into it without a jump. See the README for
# i3 key bindings. Hidden windows are drawn from their kept images, which this style keeps
# (keep-image-when-hidden). Like cube.conf, it is best with picom's glx or egl backend.
#
# A box of var-sides sides whose sides are bent less and less at the edges they share
# turns into one of more and more sides: parts/prism-view.conf draws it as a prism of
# var-n / (1 - var-s) sides, from var-n folded (var-s 0) to flat (var-s 1: a million
# times var-n sides, as flat as a screen can show, well under half a pixel off).
# var-pos is a window's side, from the one the monitor shows; it carries over from the
# animation before, so a switch made while the box opens turns it smoothly. The view
# moves back (var-back) until the zoom is var-k-wall, at which all faces fit in var-fill
# of the monitor, and along the turn (var-pan) until the middle of the strip is in view:
# then each side is in its place on the strip, whichever the monitor shows.
# var-bright is 1 for the shown workspace and 0 for the others; the others get var-dim
# of their opacity. var-s, var-pos, var-back and var-bright carry over when one
# animation interrupts another, so unfolding, switching and folding in quick succession
# stay smooth, and unfolding during a switch of cube.conf goes on from where its box
# is, as far back as cube moved it.
# ws-unfold holds its end pose (hold), and suppresses show, hide, geometry and ws-pass,
# so the windows that i3 shows and hides in a switch keep their place in the overview.
#
# var-length is how long unfolding and folding take, in seconds; set it in both parts.
# var-n, var-camera and var-eye-mm are in parts/box.conf, shared with cube.conf, so the
# box that unfolds is the one that turns; var-fill and var-dim in parts/overview.conf,
# shared with wall.conf; var-axis and var-reverse in parts/axis.conf, shared by all
# styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["ws-unfold"];
  suppressions = ["show", "hide", "geometry", "ws-pass"];
  var-length = 0.5;
  @include "ws-direction/parts/overview.conf"
  @include "ws-direction/parts/box.conf"
  var-k-wall = "var-fill / plugin-ws-direction-faces";
  var-s = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = 0; end = 1; };
  var-bright = { curve = "linear"; duration = "var-length"; start = 1; end = "var-is-shown"; };
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = "plugin-ws-direction-index - plugin-ws-direction-shown"; end = "plugin-ws-direction-index - plugin-ws-direction-shown"; };
  var-sides = "var-n / max(1 - var-s, 0.000001)";
  var-back = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = 0; end = "var-d * (1 / var-k-wall - 1)"; };
  var-pan = "var-reverse * var-s * (plugin-ws-direction-index - var-pos - var-middle) * var-side";
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * (var-dim + (1 - var-dim) * var-bright) * var-drawn";
  hold = 1;
  @include "ws-direction/parts/prism-view.conf"
}, {
  triggers = ["ws-fold"];
  suppressions = ["show", "hide", "geometry", "ws-pass"];
  var-length = 0.5;
  @include "ws-direction/parts/overview.conf"
  @include "ws-direction/parts/box.conf"
  var-k-wall = "var-fill / plugin-ws-direction-faces";
  var-s = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = 1; end = 0; };
  var-bright = { curve = "linear"; duration = "var-length"; start = "var-is-shown"; end = 1; };
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = "plugin-ws-direction-index - plugin-ws-direction-shown"; end = "plugin-ws-direction-index - plugin-ws-direction-shown"; };
  var-sides = "var-n / max(1 - var-s, 0.000001)";
  var-back = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-length"; start = "var-d * (1 / var-k-wall - 1)"; end = 0; };
  var-pan = "var-reverse * var-s * (plugin-ws-direction-index - var-pos - var-middle) * var-side";
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * (var-dim + (1 - var-dim) * var-bright) * var-drawn";
  @include "ws-direction/parts/prism-view.conf"
});
