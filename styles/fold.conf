# Fold: going to a higher workspace, the old one folds into the top (or left) edge while
# the new one unfolds from the bottom (or right) edge, like a flat cube turning; going
# back folds the other way. A window scaled by f toward an edge E moves by
# (1 - f) * (E - window position). Both sides use the same curve, so together they
# always fill the monitor.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/fold.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-slide is 1 for a workspace switch and 0
# otherwise; then the window gets a short fade. var-sideways is 1 on a portrait monitor
# and 0 on a landscape one: the workspaces move along the short side of the monitor. On a
# square monitor it is 0.5, and they move diagonally.

animations = ({
  triggers = ["show", "open"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.35;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-fold = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "1 - var-slide"; end = 1; };
  var-edge-x = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (1 + plugin-ws-direction-direction) / 2";
  var-edge-y = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (1 + plugin-ws-direction-direction) / 2";
  scale-x = "1 - (1 - var-fold) * var-sideways";
  scale-y = "1 - (1 - var-fold) * (1 - var-sideways)";
  offset-x = "(1 - scale-x) * (var-edge-x - window-x)";
  offset-y = "(1 - scale-y) * (var-edge-y - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.35;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-fold = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = 1; end = "1 - var-slide"; };
  var-edge-x = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width * (1 - plugin-ws-direction-direction) / 2";
  var-edge-y = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height * (1 - plugin-ws-direction-direction) / 2";
  scale-x = "1 - (1 - var-fold) * var-sideways";
  scale-y = "1 - (1 - var-fold) * (1 - var-sideways)";
  offset-x = "(1 - scale-x) * (var-edge-x - window-x)";
  offset-y = "(1 - scale-y) * (var-edge-y - window-y)";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
