# Pass-zoom-pan: zoom-pan, but a switch that passes workspaces shows them on the way. The
# view zooms out, pans along the workspaces as tiles with a gap between them, and zooms
# back in. Going from 1 to 4, the tiles of 2 and 3 pass between the old and the new one.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/pass-zoom-pan.conf"
#   });
#
# It draws hidden workspaces like pass-slide: it keeps their images while they are hidden
# (keep-image-when-hidden), the plugin starts ws-pass on all windows of a switch in one
# frame, and ws-pass suppresses show and hide. See pass-slide.conf and the README.
#
# The zoom and the offset are in parts/zoom.conf, shared with zoom-pan.conf,
# pass-zoom-cascade.conf and wall.conf: the whole workspace scales around the middle of
# the monitor by var-k, with the workspaces var-gap of a monitor apart. The pan is
# pass-slide's: each window moves from var-face to var-face - var-travel, so the
# workspaces move as one strip. k dips by var-zoom times var-dip, which is 1 halfway and
# starts and ends without speed, and most of the panning happens while zoomed out (the
# steep ease-in-out).
#
# Settings, in each of the three parts: var-length is how long a switch to the next
# workspace takes, in seconds; var-pass-growth is how much of var-length each workspace
# passed adds. How far it zooms out (var-zoom) and the gap between the tiles (var-gap)
# are in parts/zoom.conf. Which way the workspaces lie (var-axis, var-reverse), the fade
# of windows outside a switch (var-other-time) and whether they lie on a ring (var-wrap)
# are in parts/axis.conf and parts/switch.conf, shared by all switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/zoom.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-k = "1 - var-zoom * var-dip";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/zoom.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-k = "1 - var-zoom * var-dip";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/zoom.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-k = "1 - var-zoom * var-dip";
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
