# Zoom-pan: on a workspace switch the view zooms out, pans to the next workspace and
# zooms back in, as if the workspaces were tiles side by side. Going to a higher
# workspace the new one comes from below (or from the right), like slide.
#
# The whole workspace scales around the middle of the monitor (mx, my) by k, with the
# workspaces var-gap of a monitor apart. picom scales a window around its top-left
# corner, so a window at x lands at mx + k * (x + pan - mx): an offset of
# (1 - k) * (mx - x) + k * pan. k dips by var-zoom halfway through (4 q (1 - q) is 1
# there), and most of the panning happens while zoomed out (the steep ease-in-out).
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/zoom-pan.conf"
#   });
#
# var-length is how long a workspace switch takes, in seconds; set it in both parts to
# make the style faster or slower. var-zoom is how far it zooms out: 0.15 is to 85%.
# var-slide is 1 for a workspace switch and 0 otherwise; then the window gets a short
# fade. var-sideways is 1 on a portrait monitor and 0 on a landscape one: the workspaces
# move along the short side of the monitor.

animations = ({
  triggers = ["show", "open"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.4;
  var-zoom = 0.15;
  var-gap = 0.05;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-q = { curve = "linear"; duration = "var-time"; start = 0; end = 1; };
  var-pos = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = "var-time"; start = "plugin-ws-direction-direction"; end = 0; };
  var-k = "1 - var-zoom * 4 * var-q * (1 - var-q) * var-slide";
  var-mx = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
  var-my = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
  var-pan-x = "var-pos * var-sideways * plugin-ws-direction-monitor-width * (1 + var-gap)";
  var-pan-y = "var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height * (1 + var-gap)";
  scale-x = "var-k";
  scale-y = "var-k";
  offset-x = "(1 - var-k) * (var-mx - window-x) + var-k * var-pan-x";
  offset-y = "(1 - var-k) * (var-my - window-y) + var-k * var-pan-y";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "1 / (1 + (plugin-ws-direction-monitor-width / plugin-ws-direction-monitor-height) ^ 50)";
  var-length = 0.4;
  var-zoom = 0.15;
  var-gap = 0.05;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-q = { curve = "linear"; duration = "var-time"; start = 0; end = 1; };
  var-pos = { curve = "cubic-bezier(0.65, 0, 0.35, 1)"; duration = "var-time"; start = 0; end = "0 - plugin-ws-direction-direction"; };
  var-k = "1 - var-zoom * 4 * var-q * (1 - var-q) * var-slide";
  var-mx = "plugin-ws-direction-monitor-x + plugin-ws-direction-monitor-width / 2";
  var-my = "plugin-ws-direction-monitor-y + plugin-ws-direction-monitor-height / 2";
  var-pan-x = "var-pos * var-sideways * plugin-ws-direction-monitor-width * (1 + var-gap)";
  var-pan-y = "var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height * (1 + var-gap)";
  scale-x = "var-k";
  scale-y = "var-k";
  offset-x = "(1 - var-k) * (var-mx - window-x) + var-k * var-pan-x";
  offset-y = "(1 - var-k) * (var-my - window-y) + var-k * var-pan-y";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
