# Flip: the workspace turns over like a card, seen in perspective, and the new workspace
# is on its back. A switch that passes workspaces flips past them: going from 1 to 4,
# the card turns over three times, and 2 and 3 show on the way.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded. The plugin starts
# the trigger ws-pass on the windows of every switch, and declares it itself:
#   rules = ({
#     match = "!override_redirect && window_type = 'normal'";
#     @include "ws-direction/flip.conf"
#   });
#
# picom's glx and egl backends draw it with sampling that keeps squeezed text from
# shimmering; the xrender backend draws it in perspective too, but in tiles, which is
# slower, and samples a squeezed window plainly, so text can shimmer there. It draws
# hidden workspaces like pass-slide: it keeps their images while they are hidden
# (keep-image-when-hidden), the plugin starts ws-pass on all windows of a switch in one
# frame, and ws-pass suppresses show and hide. See pass-slide.conf and the README. Only
# the windows turn: the wallpaper stays where it is. picom draws a window's shadow, blur
# and frame opacity through the turn.
#
# It is cube.conf with a box of two sides, which is a card: each window moves from its
# side to side - var-travel (var-pos), and only the workspace nearest to the front is
# drawn on each side. While it turns, the card moves back so that it stays on the
# monitor. The math is in parts/prism.conf.
#
# Settings, in each of the three parts: var-length is how long a switch to the next
# workspace takes, in seconds; var-pass-growth is how much of var-length each workspace
# passed adds. var-fit is how far the card moves back while it turns: 1 is just far
# enough for it to stay on the monitor, more is a margin, 0 not at all. The eye is
# var-camera sides of the card from the monitor (parts/box.conf, shared with cube.conf
# and unfold.conf). Which way it turns (var-axis, var-reverse) and the fade of windows
# outside a switch (var-other-time) are in parts/axis.conf and parts/switch.conf, shared
# by all switch styles.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  var-fit = 1;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/box.conf"
  var-sides = 2;
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  opacity = "var-fade * var-drawn";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
  @include "ws-direction/parts/prism.conf"
}, {
  triggers = ["hide"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  var-fit = 1;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/box.conf"
  var-sides = 2;
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  opacity = "var-fade * var-drawn";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
  @include "ws-direction/parts/prism.conf"
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.4;
  var-pass-growth = 0.2;
  var-fit = 1;
  @include "ws-direction/parts/switch.conf"
  @include "ws-direction/parts/box.conf"
  var-sides = 2;
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  opacity = "window-mapped-opacity * plugin-ws-direction-placed * var-slide * var-drawn";
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
  @include "ws-direction/parts/prism.conf"
});
