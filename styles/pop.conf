# Pop: on a workspace switch the windows of the old workspace shrink into their middles
# and fade, and those of the new one pop out of theirs, at their own proportions. It goes
# with win-cause's pop. A switch that passes workspaces pops them in and out on the way.
# Needs a picom with window-image-width.
#
# Use it in a rule of picom.conf, with the ws-direction plugin loaded, as slide.conf. It
# puts the windows on the strip of workspaces as slide does (var-pos, from var-face to
# var-face - var-travel), through ws-pass, but they stay in their places: how far a window
# is from the view sets its size and opacity (parts/pop.conf).
#
# Settings, in each of the three parts: var-length and var-pass-growth as in slide.conf;
# var-small, the size a window shrinks to; var-gone, how far from the view, in workspaces,
# a window has gone. The old and the new windows overlap where both are less than
# var-gone from the view.

keep-image-when-hidden = true;
animations = ({
  triggers = ["show", "open"];
  var-length = 0.3;
  var-pass-growth = 0.2;
  var-small = 0.3;
  var-gone = 0.6;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-travel";
  var-to = 0;
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  opacity = "var-fade * var-shown";
  @include "ws-direction/parts/pop.conf"
}, {
  triggers = ["hide"];
  var-length = 0.3;
  var-pass-growth = 0.2;
  var-small = 0.3;
  var-gone = 0.6;
  @include "ws-direction/parts/switch.conf"
  var-from = 0;
  var-to = "0 - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  var-fade = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  opacity = "var-fade * var-shown";
  @include "ws-direction/parts/pop.conf"
}, {
  triggers = ["ws-pass"];
  suppressions = ["show", "hide"];
  var-length = 0.3;
  var-pass-growth = 0.2;
  var-small = 0.3;
  var-gone = 0.6;
  @include "ws-direction/parts/switch.conf"
  var-from = "var-face";
  var-to = "var-face - var-travel";
  var-ease = { curve = "cubic-bezier(0.45, 0, 0.55, 1)"; duration = "var-time"; start = "var-start"; end = "var-end"; reset = true; };
  opacity = "max(window-mapped-opacity, plugin-ws-direction-backdrop) * plugin-ws-direction-placed * var-slide * var-shown";
  @include "ws-direction/parts/pop.conf"
});
