# Not a style: the harness's switch animation with show and hide only, as slide had
# before it moved onto ws-pass. tests/run.sh checks the plugin's variables for every show,
# open and hide with it, and takes screenshots of it partway through slowed down slides.
# It is self-contained (no parts), so the harness can change its timing with sed.
#
# The new workspace comes in from below (or from the right) and pushes the old one out.
# var-slide is 1 for a workspace switch and 0 otherwise; then the window gets a short
# fade. var-sideways is 1 on a portrait or square monitor and 0 on a landscape one.

animations = ({
  triggers = ["show", "open"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "min(1, floor(plugin-ws-direction-monitor-height / plugin-ws-direction-monitor-width))";
  var-length = 0.25;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = "plugin-ws-direction-direction"; end = 0; };
  offset-x = "var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity * var-slide"; end = "window-raw-opacity"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
}, {
  triggers = ["hide"];
  var-slide = "plugin-ws-direction-direction ^ 2";
  var-sideways = "min(1, floor(plugin-ws-direction-monitor-height / plugin-ws-direction-monitor-width))";
  var-length = 0.25;
  var-time = "var-length * var-slide + 0.1 * (1 - var-slide)";
  var-pos = { curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; duration = "var-time"; start = 0; end = "0 - plugin-ws-direction-direction"; };
  offset-x = "var-pos * var-sideways * plugin-ws-direction-monitor-width";
  offset-y = "var-pos * (1 - var-sideways) * plugin-ws-direction-monitor-height";
  opacity = { curve = "linear"; duration = "var-time"; start = "window-raw-opacity-before"; end = "window-raw-opacity-before * var-slide"; };
  crop-x = "plugin-ws-direction-monitor-x";
  crop-y = "plugin-ws-direction-monitor-y";
  crop-width = "plugin-ws-direction-monitor-width";
  crop-height = "plugin-ws-direction-monitor-height";
});
