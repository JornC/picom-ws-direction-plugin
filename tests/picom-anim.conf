# Test config for tests/run.sh: slides with a fixed direction per monitor and no
# workspace variables. On the left monitor (x < 3440) the old workspace goes up and the
# new one comes from below; on the right one the old goes left and the new comes from the
# right. Every slide is cropped to its own monitor. No script here reads a variable of
# the plugin, so the harness checks that picom never asks the plugin.

backend = "glx";
vsync = true;
use-damage = true;

# Unredirecting fullscreen windows turns compositing (and animations) off. Keep it off while testing.
unredir-if-possible = false;

rules = (
  {
    match = "x < 3440 && !override_redirect && window_type = 'normal' && !I3_FLOATING_WINDOW@";
    animations = (
      {
        triggers = ["hide"];
        opacity = 1;
        offset-y = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.18; start = 0; end = "0 - window-monitor-height"; };
        crop-x = "window-monitor-x";
        crop-y = "window-monitor-y";
        crop-width = "window-monitor-width";
        crop-height = "window-monitor-height";
      },
      {
        triggers = ["show"];
        offset-y = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.18; start = "window-monitor-height"; end = 0; };
        crop-x = "window-monitor-x";
        crop-y = "window-monitor-y";
        crop-width = "window-monitor-width";
        crop-height = "window-monitor-height";
      }
    );
  },
  {
    match = "x >= 3440 && !override_redirect && window_type = 'normal' && !I3_FLOATING_WINDOW@";
    animations = (
      {
        triggers = ["hide"];
        opacity = 1;
        offset-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.18; start = 0; end = "0 - window-monitor-width"; };
        crop-x = "window-monitor-x";
        crop-y = "window-monitor-y";
        crop-width = "window-monitor-width";
        crop-height = "window-monitor-height";
      },
      {
        triggers = ["show"];
        offset-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.18; start = "window-monitor-width"; end = 0; };
        crop-x = "window-monitor-x";
        crop-y = "window-monitor-y";
        crop-width = "window-monitor-width";
        crop-height = "window-monitor-height";
      }
    );
  }
);
